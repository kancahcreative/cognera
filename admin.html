function cleanQuestionText(v){return String(v??'').replace(/\r/g,'').replace(/\n[ \t]*\n+/g,'\n').trim()}
async function uploadQuestionImage(file){

 const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
 const path=`questions/${crypto.randomUUID()}.${ext}`;
 const up=await SB.storage.from('community-media').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg',cacheControl:'3600'});

function questionEditorBody(r={}){

 <div class="field full"><label>Kunci jawaban</label><input name="correct_text" value="${esc(r.correct_answer||(['A','B','C','D','E'][Number(r.answer)]||''))}" placeholder="PG: A atau A,C · Isian: jawaban benar · Uraian: rubrik/kunci"></div>

async function saveQuestionFromForm(m,r,tryoutId){
 const f=m.querySelector('#qe'), body=cleanQuestionText(f.elements.body.value), type=f.elements.qtype.value;
 if(!body)return toast('Pertanyaan wajib diisi.');
 const options=[0,1,2,3,4].map(i=>cleanQuestionText(f.elements['o'+i].value)).filter(Boolean);
 if((type==='single_choice'||type==='multiple_choice')&&options.length<2)return toast('Minimal isi 2 opsi jawaban.');
 let image_url=r?.image_url||'';const file=f.elements.image.files?.[0];if(file){try{image_url=await uploadQuestionImage(file)}catch(e){return toast('Gagal upload gambar: '+e.message)}}
 const key=cleanQuestionText(f.elements.correct_text.value);
 let answer=-1, correct_answer=key;
 if(type==='single_choice'){const L=(key.match(/[ABCDE]/i)||[])[0]?.toUpperCase();answer=L?['A','B','C','D','E'].indexOf(L):-1;correct_answer=L||key;}
 if(type==='multiple_choice'){answer=-1;correct_answer=(key.toUpperCase().match(/[ABCDE]/g)||[]).join(',');}
 const storedOptions=type==='single_choice'?options:{type,choices:options};
 const o={body,text:body,options:storedOptions,answer,correct_answer:correct_answer||null,subtest:f.elements.subtest.value,active:f.elements.active.value==='true',explanation:cleanQuestionText(f.elements.explanation.value),image_url:image_url||null};
 const res=r?.id?await SB.from('questions').update(o).eq('id',r.id):await SB.from('questions').insert({tryout_id:tryoutId,kind:tryoutId?'tryout':'drill',...o});
 if(res.error)return toast(res.error.message);return true;
}

 if(error)return toast(error.message);

 render();m.querySelector('#qSearch').oninput=render;

 m.querySelector('#tqTable').onclick=async e=>{
  const eb=e.target.closest('[data-edit-q]');
  const db=e.target.closest('[data-del-q]');
  if(db){const id=db.dataset.delQ;const r=rows.find(x=>String(x.id)===String(id));if(!r)return;if(!confirm(`Hapus soal #${id}? Soal akan dihapus permanen.`))return;const del=await SB.from('questions').delete().eq('id',id);if(del.error)return toast(del.error.message);rows=rows.filter(x=>String(x.id)!==String(id));render();toast('Soal dihapus');return}
  if(!eb)return;const r=rows.find(x=>String(x.id)===String(eb.dataset.editQ));if(!r)return;
  const em=modal('Edit soal #'+r.id,questionEditorBody(r),'<button type="button" class="btn" data-close>Batal</button><button type="button" class="btn y" id="saveQE">Simpan perubahan</button>');
  em.querySelector('#saveQE').onclick=async()=>{const ok=await saveQuestionFromForm(em,r,t.id);if(!ok)return;Object.assign(r,{body:cleanQuestionText(em.querySelector('[name="body"]').value),text:cleanQuestionText(em.querySelector('[name="body"]').value)});em.remove();render();toast('Soal diperbarui')};
 };
}

function fieldFor(k,v){const bool=['active','published','onboarded'].includes(k);if(bool)return `<div class="field"><label>${k}</label><input name="${k}" type="checkbox" ${v?'checked':''}></div>`;if(k==='months')return `<div class="field"><label>Durasi (bulan)</label><select name="months"><option value="1" ${Number(v)===1?'selected':''}>1 bulan</option><option value="3" ${Number(v)===3?'selected':''}>3 bulan</option><option value="6" ${Number(v)===6?'selected':''}>6 bulan</option><option value="12" ${Number(v)===12||v==null?'selected':''}>12 bulan</option></select></div>`;let type=['amount','price','strike','tries','pct','flat','vat_pct','round_to','sort','xp','goal','tahun'].includes(k)?'number':'text';let full=['text','description','passage','content','message'].includes(k);return `<div class="field ${full?'full':''}"><label>${k}</label>${full?`<textarea name="${k}">${esc(v??'')}</textarea>`:`<input name="${k}" type="${type}" value="${esc(v??'')}">`}</div>`}

async function deleteRow(table,row){if(!row||!confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.'))return;const pk=tables[table].pk;const r=await SB.from(table).delete().eq(pk,row[pk]);if(r.error)return toast(r.error.message);toast('Data dihapus');loadManager(table)}
function downloadCSV(rows,name){if(!rows.length)return toast('Tidak ada data untuk diekspor.');const cols=[...new Set(rows.flatMap(x=>Object.keys(x)))];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>`"${String(Array.isArray(r[c])?r[c].length:r[c]??'').replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}

 const jalur=document.querySelector('#impJalur').value;
 const type=document.querySelector('#impType').value;
 if(mode==='tryout'){
   const review=parsed.filter(x=>x.status!=='valid');
   if(review.length&&!confirm(`${review.length} soal masih berstatus Review. Tetap simpan?`))return;
   const tryoutId=crypto.randomUUID();
   const tr=await SB.from('tryouts').insert({id:tryoutId,title,jalur,access:'free',max_tries:3,active:true,subs:[...new Set(parsed.map(x=>x.subtest))]}).select('id').single();
   if(tr.error)return toast('Gagal membuat tryout: '+tr.error.message);
   const payload=parsed.map(x=>questionPayload(x,'tryout',tryoutId,type));
   const r=await SB.from('questions').insert(payload);
   if(r.error){await SB.from('tryouts').delete().eq('id',tryoutId);return toast('Gagal menyimpan soal: '+r.error.message)}
   toast(`${parsed.length} soal masuk ke tryout “${title}”.`);await tryoutsPage();
 }else{
   const payload=parsed.map(x=>questionPayload(x,'drill',null,type));
   const r=await SB.from('questions').insert(payload);
   if(r.error)return toast('Gagal menyimpan soal latihan: '+r.error.message);
   toast(`${parsed.length} soal masuk ke Latihan.`);await latihanPage();
 }
};
}
function questionPayload(x,kind,tryoutId,typeOverride){
 const type=typeOverride==='auto'?(x.a&&x.b?'single_choice':'short_text'):(typeOverride||x.type||'single_choice');
 const choices=[x.a,x.b,x.c,x.d,x.e].map(cleanQuestionText).filter(Boolean);
 const letters=String(x.answer||'').toUpperCase().match(/[ABCDE]/g)||[];
 let answer=letters.length?['A','B','C','D','E'].indexOf(letters[0]):-1;
 let correct=letters.join(',');
 if(type==='multiple_choice') answer=-1;
 if(type==='short_text'||type==='essay') { answer=-1; correct=cleanQuestionText(x.answer||x.correct_answer||''); }
 const options=(type==='single_choice')?choices:{type,choices};
 return {subtest:validSubtest(x.subtest),kind,tryout_id:tryoutId,body:cleanQuestionText(x.text),text:cleanQuestionText(x.text),options,answer,correct_answer:correct||null,passage:x.passage||null,explanation:x.explanation||'',points:x.points||null,active:true};
}
async function parsePdfQuestions(file,keyFile){
 if(!window.pdfjsLib){throw new Error('PDF parser belum siap. Pastikan koneksi internet tersedia untuk memuat PDF.js.')}
 const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let pages=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();pages.push(tc.items.map(x=>x.str).join(' '))}let text=pages.join('\n');let keyText='';if(keyFile){if(keyFile.type==='application/pdf'){const kb=await keyFile.arrayBuffer();const kp=await pdfjsLib.getDocument({data:kb}).promise;for(let i=1;i<=kp.numPages;i++){const p=await kp.getPage(i);const tc=await p.getTextContent();keyText+='\n'+tc.items.map(x=>x.str).join(' ')}}else keyText=await keyFile.text()}
 const answers={};const km=keyText.matchAll(/(?:^|\s)(\d{1,3})\s*[:.)-]?\s*([ABCDE])(?=\s|$)/gi);for(const m of km)answers[Number(m[1])]=m[2].toUpperCase();
 const re=/(?:^|\n|\s)(\d{1,3})[.)]\s+([\s\S]*?)(?=(?:\n|\s)\d{1,3}[.)]\s+|$)/g;let out=[],m;while((m=re.exec(text))){let block=m[2].replace(/\s+/g,' ').trim();const opts={};for(const l of ['A','B','C','D','E']){const next=String.fromCharCode(l.charCodeAt(0)+1);const rx=new RegExp('\\b'+l+'[.)]\\s+([\\s\\S]*?)(?=\\s'+next+'[.)]\\s+|$)','i');const mm=block.match(rx);if(mm)opts[l.toLowerCase()]=mm[1].trim()}let q=block.replace(/\s+[ABCDE][.)]\s+[\s\S]*$/i,'').trim();let ans=answers[Number(m[1])]||'';const complete=q.length>12&&opts.a&&opts.b&&opts.c&&opts.d&&(opts.e||true);out.push({no:Number(m[1]),text:q,a:opts.a||'',b:opts.b||'',c:opts.c||'',d:opts.d||'',e:opts.e||'',answer:ans,status:complete&&ans?'valid':'warn'});}
 if(!out.length){const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);let no=0;for(let i=0;i<lines.length;i++){const mm=lines[i].match(/^(\d{1,3})[.)]\s*(.+)$/);if(mm){no=Number(mm[1]);out.push({no,text:mm[2],a:'',b:'',c:'',d:'',e:'',answer:answers[no]||'',status:answers[no]?'valid':'warn'})}}}
 return out;
}
