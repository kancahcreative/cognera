/* ===== Definisi resource (CRUD generik) ===== */
const R={
 questions:{t:'Soal',pk:['id'],order:'created_at',
  cols:[['image_url','Gbr','i'],['subtest','Subtes','s'],['kind','Jenis'],['tryout_id','Tryout'],['text','Soal','t'],['active','Aktif','b']],
  f:[{k:'subtest',l:'Subtes',t:'sel',o:SUBS},{k:'kind',l:'Jenis',t:'sel',o:{tryout:'Tryout',drill:'Latihan soal'}},{k:'tryout_id',l:'ID Tryout (wajib bila jenis Tryout)',t:'txt'},
   {k:'passage',l:'Bacaan / stimulus (opsional)',t:'ta'},{k:'text',l:'Teks soal',t:'ta',req:1},{k:'image_url',l:'Gambar soal',t:'img'},

   {k:'points',l:'Poin tiap opsi, khusus TKP (satu per baris, boleh kosong)',t:'nums'},{k:'explanation',l:'Pembahasan',t:'ta'},{k:'active',l:'Aktif',t:'bool',d:true}],
  check:o=>o.options.length<2?'Minimal 2 opsi.':o.answer<0||o.answer>=o.options.length?'Nomor jawaban di luar jumlah opsi.':o.points&&o.points.length!==o.options.length?'Jumlah poin harus sama dengan jumlah opsi.':o.kind==='tryout'&&!o.tryout_id?'Isi ID Tryout.':''},
 tryouts:{t:'Tryout',pk:['id'],order:'created_at',

  f:[{k:'id',l:'ID (huruf kecil, tanpa spasi; tidak bisa diubah)',t:'txt',req:1,lock:1},{k:'title',l:'Judul',t:'txt',req:1},{k:'jalur',l:'Jalur',t:'sel',o:JAL},
   {k:'access',l:'Akses',t:'sel',o:{free:'Gratis',premium:'Premium'}},{k:'subs',l:'Kode subtes (satu per baris, mis. pu, pk, lbi)',t:'lines'},
   {k:'tries',l:'Batas percobaan (kosong = tanpa batas)',t:'num'},{k:'image_url',l:'Gambar kartu',t:'img'},{k:'active',l:'Aktif',t:'bool',d:true}]},
 community_posts:{t:'Komunitas',pk:['id'],order:'created_at',noAdd:1,
  cols:[['avatar','Foto','a'],['author','Penulis'],['tag','Subtes','s'],['text','Isi','t'],['likes','Suka','n'],['replies','Balasan','n'],['created_at','Waktu','d']],
  f:[{k:'text',l:'Isi postingan',t:'ta',req:1}]},
 profiles:{t:'Pengguna',pk:['id'],noAdd:1,noDel:1,
  cols:[['avatar','Foto','a'],['email','Email'],['name','Nama'],['pkgs','Paket','p'],['jalur','Jalur'],['sekolah','Sekolah'],['xp','XP']],
  f:[{k:'name',l:'Nama',t:'txt',req:1},{k:'jalur',l:'Jalur',t:'sel',o:JAL},{k:'tahun',l:'Tahun target',t:'num'},{k:'goal',l:'Target',t:'num'},{k:'sekolah',l:'Sekolah',t:'txt'},{k:'xp',l:'XP',t:'num'},{k:'onboarded',l:'Sudah onboarding',t:'bool'}],
  extra:[['Paket',x=>crud('entitlements',{user_id:x.id})],['Hasil',x=>results(x.id)]]},
 entitlements:{t:'Akses paket',pk:['user_id','package_id'],
  cols:[['who','Pengguna'],['package_id','Paket'],['ends_at','Berakhir','d']],
  f:[{k:'user_id',l:'User ID',t:'txt',req:1},{k:'package_id',l:'ID paket (mis. utbk27)',t:'txt',req:1},{k:'ends_at',l:'Berakhir (kosong = selamanya)',t:'date'}]}
};
const pkOf=(r,x)=>Object.fromEntries(r.pk.map(k=>[k,x[k]]));
function cell(v,k){if(k==='n')return Array.isArray(v)?v.length:0;if(k==='a')return v?`<img src="${esc(v)}" alt="" referrerpolicy="no-referrer" style="border-radius:50%">`:'<span class="mut">–</span>';if(k==='p'){const n=Date.now();return v&&v.length?v.map(z=>`<span class="chip" style="${!z.ends_at||new Date(z.ends_at)>n?'background:#fff7d7':'opacity:.55'}">${esc(z.package_id)}${!z.ends_at||new Date(z.ends_at)>n?'':' (habis)'}</span>`).join(''):'<span class="mut">Gratis</span>'}if(k==='i')return v?`<img src="${esc(v)}" alt="">`:'';if(k==='b')return v?'✓':'–';if(k==='t')return esc(String(v||'').slice(0,70));if(k==='d')return v?esc(fmt(v)):'∞';if(k==='s')return esc(SUBS[v]||v);return esc(v)}
async function load(n,filter){
 let q=SB.from(n).select('*').limit(1000);if(filter)q=q.match(filter);if(R[n].order)q=q.order(R[n].order,{ascending:false});
 const {data,error}=await q;if(error)throw error;
 if(n==='profiles'||n==='entitlements'){const u=await SB.rpc('admin_users'),m=Object.fromEntries((u.data||[]).map(x=>[x.id,x.email])),g=Object.fromEntries((u.data||[]).map(x=>[x.id,x.avatar]));
  if(n==='profiles'){const [e,ud]=await Promise.all([SB.from('entitlements').select('user_id,package_id,ends_at'),SB.from('user_data').select('user_id,av:data->profile->>avatar').limit(1000)]),pk={},av=Object.fromEntries((ud.data||[]).map(z=>[z.user_id,z.av]));(e.data||[]).forEach(z=>(pk[z.user_id]=pk[z.user_id]||[]).push(z));data.forEach(x=>{x.email=m[x.id]||'';x.pkgs=pk[x.id]||[];x.avatar=av[x.id]||g[x.id]||''})}
  else{const p=await SB.from('profiles').select('id,name'),nm=Object.fromEntries((p.data||[]).map(x=>[x.id,x.name]));data.forEach(x=>x.who=[nm[x.user_id],m[x.user_id]].filter(Boolean).join(' · ')||x.user_id)}}
 return data}
async function upload(file){
 if(file.size>3e6)throw new Error('Ukuran gambar maksimal 3 MB.');
 const ext=(file.name.split('.').pop()||'png').toLowerCase(),path=`${new Date().getFullYear()}/${crypto.randomUUID()}.${ext}`;
 const {error}=await SB.storage.from(CFG.BUCKET).upload(path,file,{cacheControl:'31536000'});if(error)throw error;
 return SB.storage.from(CFG.BUCKET).getPublicUrl(path).data.publicUrl}

/* ===== Daftar + form CRUD ===== */
async function crud(n,filter){
 const r=R[n];main.innerHTML='<p class="mut">Memuat…</p>';let rows;
 try{rows=await load(n,filter)}catch(e){return main.innerHTML=`<div class="err">${esc(e.message)}<br>Pastikan admin-schema.sql sudah dijalankan.</div>`}
 main.innerHTML=`<h1>${r.t}${filter?' (terfilter)':''}</h1><div class="bar"><input id="q" placeholder="Cari…" style="max-width:260px">${r.noAdd?'':'<button class="btn y" id="add">+ Tambah</button>'}${filter?'<button class="btn" id="all">Lihat semua</button>':''}<span class="mut" id="cn"></span></div><div class="card tw" id="tb"></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase(),L=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#cn').textContent=L.length+' data';
  $('#tb').innerHTML=`<table><tr>${r.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>${L.map(x=>{const i=rows.indexOf(x);return `<tr>${r.cols.map(c=>`<td>${cell(x[c[0]],c[2])}</td>`).join('')}<td style="white-space:nowrap">${(r.extra||[]).map((e,j)=>`<button class="btn s" data-x="${j}" data-i="${i}">${e[0]}</button>`).join(' ')} <button class="btn s" data-e="${i}">Edit</button>${r.noDel?'':` <button class="btn s d" data-d="${i}">Hapus</button>`}</td></tr>`}).join('')||'<tr><td class="mut">Belum ada data.</td></tr>'}</table>`};
 draw();$('#q').oninput=draw;if($('#all'))$('#all').onclick=()=>crud(n);if($('#add'))$('#add').onclick=()=>form(n,null,filter);
 $('#tb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.e!=null)form(n,rows[d.e],filter);
  else if(d.x!=null)r.extra[d.x][1](rows[d.i]);
  else if(d.d!=null&&confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.')){const {error}=await SB.from(n).delete().match(pkOf(r,rows[d.d]));error?toast(error.message):(toast('Terhapus'),crud(n,filter))}}}
function form(n,row,filter){
 const r=R[n],d=row||{},fs=r.f.filter(f=>!(filter&&f.k in filter));
 const inp=f=>{let v=d[f.k];if(v==null)v=row?'':(f.d??'');const nm=`name="${f.k}"`;
  if(f.t==='txt')return `<input ${nm} value="${esc(v)}" ${f.lock&&row?'disabled':''}>`;
  if(f.t==='ta')return `<textarea ${nm}>${esc(v)}</textarea>`;
  if(f.t==='num')return `<input ${nm} type="number" value="${esc(v)}">`;
  if(f.t==='idx')return `<input ${nm} type="number" min="1" value="${row?d.answer+1:''}">`;
  if(f.t==='date')return `<input ${nm} type="date" value="${v?String(v).slice(0,10):''}">`;
  if(f.t==='sel')return `<select ${nm}>${Object.entries(f.o).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  if(f.t==='lines'||f.t==='nums')return `<textarea ${nm}>${esc((Array.isArray(v)?v:[]).join('\n'))}</textarea>`;
  if(f.t==='img')return `<input type="hidden" ${nm} value="${esc(v)}"><input type="file" accept="image/*" data-up="${f.k}"><img class="pv" ${v?`src="${esc(v)}"`:'hidden'}> <button type="button" class="btn s d" data-rm="${f.k}">Hapus gambar</button>`;
  return ''};
 const m=modal(`<form><h3>${row?'Edit':'Tambah'} ${r.t}</h3>${fs.map(f=>f.t==='bool'?`<label class="ck"><input type="checkbox" name="${f.k}" ${(row?d[f.k]:f.d)?'checked':''}> ${f.l}</label>`:`<label>${f.l}</label>${inp(f)}`).join('')}<div id="fe"></div><div class="act"><button type="button" class="btn" id="cx">Batal</button><button class="btn p" id="sv">Simpan</button></div></form>`);
 const fm=$('form',m);$('#cx',m).onclick=()=>m.remove();
 fm.onchange=async e=>{const k=e.target.dataset.up;if(!k||!e.target.files[0])return;try{toast('Mengunggah…');const u=await upload(e.target.files[0]);fm.elements[k].value=u;const im=$('.pv',e.target.parentNode);im.src=u;im.hidden=false;toast('Gambar terunggah')}catch(x){toast(x.message)}};
 fm.onclick=e=>{const k=e.target.dataset.rm;if(k){fm.elements[k].value='';$('.pv',e.target.parentNode).hidden=true}};
 fm.onsubmit=async e=>{e.preventDefault();const o={};let er='';
  fs.forEach(f=>{const el=fm.elements[f.k];if(!el)return;let v=f.t==='bool'?el.checked:el.value.trim();
   if(f.req&&v===''&&!er)er=f.l.split(' (')[0]+' wajib diisi.';
   if(f.t==='lines')v=v.split('\n').map(s=>s.trim()).filter(Boolean);else if(f.t==='nums')v=v?v.split('\n').map(Number).filter(x=>!isNaN(x)):null;
   else if(f.t==='idx')v=Number(v)-1;else if(f.t==='num')v=v===''?null:Number(v);else if(f.t==='date')v=v?new Date(v+'T23:59:59').toISOString():null;else if(v==='')v=null;
   o[f.k]=v});
  if(!er&&r.check)er=r.check({...d,...o});if(er)return $('#fe',m).innerHTML=`<div class="err">${esc(er)}</div>`;
  Object.assign(o,filter||{});$('#sv',m).disabled=true;
  const res=row?await SB.from(n).update(o).match(pkOf(r,row)):await SB.from(n).insert(o);
  if(res.error){$('#sv',m).disabled=false;return $('#fe',m).innerHTML=`<div class="err">${esc(res.error.message)}</div>`}
  m.remove();toast('Tersimpan');crud(n,filter)}}

/* ===== Hasil tryout & dasbor ===== */
async function attempts(uid){
 const [a,b,c]=await Promise.all([SB.from('user_data').select('user_id,data').limit(2000),SB.from('profiles').select('id,name'),SB.from('tryouts').select('id,title')]);
 if(a.error)throw a.error;const nm=Object.fromEntries((b.data||[]).map(x=>[x.id,x.name])),tt=Object.fromEntries((c.data||[]).map(x=>[x.id,x.title])),L=[];
 (a.data||[]).forEach(r=>{if(uid&&r.user_id!==uid)return;((r.data&&r.data.attempts)||[]).forEach(t=>L.push({...t,uid:r.user_id,name:nm[r.user_id]||'(tanpa nama)',title:tt[t.tid]||t.tid}))});
 return L.sort((x,y)=>y.at-x.at)}
const rowsA=L=>L.map((a,i)=>`<tr><td>${esc(fmt(a.at))}</td><td>${esc(a.name)}</td><td>${esc(a.title)}</td><td><b>${a.total}</b></td><td>${Math.round((a.durSec||0)/60)} mnt</td><td><button class="btn s" data-i="${i}">Detail</button></td></tr>`).join('')||'<tr><td class="mut">Belum ada hasil.</td></tr>';
const headA='<tr><th>Waktu</th><th>Pengguna</th><th>Tryout</th><th>Skor</th><th>Durasi</th><th></th></tr>';
function detail(a,done){
 const m=modal(`<h3>${esc(a.title)}</h3><p class="mut">${esc(a.name)} · ${esc(fmt(a.at))} · skor total <b>${a.total}</b></p><table><tr><th>Subtes</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>Skor</th></tr>${Object.entries(a.subs||{}).map(([k,s])=>`<tr><td>${esc(SUBS[k]||k)}</td><td>${s.correct}</td><td>${s.wrong}</td><td>${s.empty}</td><td>${s.score}</td></tr>`).join('')}</table><div class="act"><button class="btn d" id="dl">Hapus hasil ini</button><button class="btn p" id="ok">Tutup</button></div>`);
 $('#ok',m).onclick=()=>m.remove();
 $('#dl',m).onclick=async()=>{if(!confirm('Hapus hasil tryout ini dari pengguna?'))return;
  const {data,error}=await SB.from('user_data').select('data').eq('user_id',a.uid).single();if(error)return toast(error.message);
  const d=data.data;d.attempts=(d.attempts||[]).filter(x=>x.id!==a.id);const u=await SB.from('user_data').update({data:d}).eq('user_id',a.uid);
  if(u.error)return toast(u.error.message);m.remove();toast('Hasil dihapus');done()}}
async function results(uid){
 main.innerHTML='<p class="mut">Memuat…</p>';let L;try{L=await attempts(uid)}catch(e){return main.innerHTML=`<div class="err">${esc(e.message)}</div>`}
 main.innerHTML=`<h1>Hasil tryout${uid?' (satu pengguna)':''}</h1>${uid?'<div class="bar"><button class="btn" id="all">Lihat semua</button></div>':''}<div class="card tw"><table>${headA}${rowsA(L.slice(0,300))}</table></div>`;
 if($('#all'))$('#all').onclick=()=>results();$('.tw table').onclick=e=>{const b=e.target.closest('button');if(b)detail(L[b.dataset.i],()=>results(uid))}}
async function dash(){
 main.innerHTML='<p class="mut">Memuat…</p>';const cnt=async t=>(await SB.from(t).select('*',{count:'exact',head:true})).count||0;
 try{const [u,t,qs,L,en]=await Promise.all([cnt('profiles'),cnt('tryouts'),SB.from('questions').select('subtest,active'),attempts(),SB.from('entitlements').select('package_id,ends_at')]);
  const nw=Date.now(),ps={};(en.data||[]).forEach(z=>{if(!z.ends_at||new Date(z.ends_at)>nw)ps[z.package_id]=(ps[z.package_id]||0)+1});
  const q=qs.data||[],bs={};q.filter(x=>x.active).forEach(x=>bs[x.subtest]=(bs[x.subtest]||0)+1);const avg=L.length?Math.round(L.reduce((s,a)=>s+a.total,0)/L.length):0;
  const st=[['Pengguna',u],['Soal',q.length],['Tryout',t],['Percobaan tryout',L.length],['Rata-rata skor',avg]];
  main.innerHTML=`<h1>Dasbor</h1><div class="grid">${st.map(s=>`<div class="card"><span class="mut">${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div><div class="card" style="margin-bottom:16px"><b>Soal aktif per subtes</b><div style="margin-top:8px">${Object.entries(bs).map(([k,v])=>`<span class="chip">${esc(SUBS[k]||k)}: ${v}</span>`).join('')||'<span class="mut">Belum ada soal.</span>'}</div></div><div class="card" style="margin-bottom:16px"><b>Pelanggan aktif per paket</b><div style="margin-top:8px">${Object.entries(ps).map(([k,v])=>`<span class="chip">${esc(k)}: ${v}</span>`).join('')||'<span class="mut">Belum ada pelanggan paket.</span>'}</div></div><div class="card tw"><div style="padding:14px 14px 0"><b>Hasil terbaru</b></div><table>${headA}${rowsA(L.slice(0,8))}</table></div>`;
  $('.tw table').onclick=e=>{const b=e.target.closest('button');if(b)detail(L[b.dataset.i],dash)}
 }catch(e){main.innerHTML=`<div class="err">${esc(e.message)}<br>Pastikan admin-schema.sql sudah dijalankan.</div>`}}

/* ===== Shell, login ===== */
let main;const TABS=[['dash','Dasbor'],['questions','Soal'],['tryouts','Tryout'],['profiles','Pengguna'],['results','Hasil'],['community_posts','Komunitas'],['entitlements','Akses paket']];
function go(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));t==='dash'?dash():t==='results'?results():crud(t)}
function shell(){$('#app').innerHTML=`<header class="top"><span class="brand"><b>C</b>Admin</span>${TABS.map(t=>`<button class="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}<span class="sp"></span><button class="btn s" id="out">Keluar</button></header><main id="main"></main>`;main=$('#main');
 $('.top').onclick=e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.t)};$('#out').onclick=async()=>{await SB.auth.signOut();login()};go('dash')}
function login(msg){$('#app').innerHTML=`<form class="lg card"><h1>Cognera Admin</h1><label>Email</label><input name="e" type="email" required autocomplete="username"><label>Kata sandi</label><input name="p" type="password" required autocomplete="current-password"><div id="le">${msg?`<div class="err">${esc(msg)}</div>`:''}</div><div class="act"><button class="btn p" style="width:100%">Masuk</button></div></form>`;
 $('form').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,{error}=await SB.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});
  if(error)return $('#le').innerHTML='<div class="err">Email atau kata sandi salah.</div>';boot()}}
async function boot(){
 if(!CFG.KEY)return $('#app').innerHTML='<div class="lg card"><b>Isi CFG.KEY di admin.html</b> dengan anon/publishable key Supabase.</div>';
 const {data}=await SB.auth.getSession();if(!data.session)return login();
 const a=await SB.from('admins').select('user_id').eq('user_id',data.session.user.id).maybeSingle();
 if(!a.data){await SB.auth.signOut();return login('Akun ini bukan admin.')}shell()}
boot();
</script></body></html>
