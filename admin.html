<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4c62f">
<title>Cognera Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--y:#f4c62f;--yd:#e5b419;--yp:#fff7d7;--ink:#191b20;--line:#e5e8ed;--bg:#f7f7f7;--mut:#68717f;--bad:#d64545;--badbg:#fdecec;--ok:#1f9d55;--okbg:#e6f6ec;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Manrope,"DM Sans",sans-serif;letter-spacing:-.03em;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Brand */
.brand{display:flex;align-items:center;gap:9px;font:800 22px Manrope,system-ui,sans-serif;letter-spacing:-1px}
.brandMark{width:30px;height:30px;border-radius:9px;background:var(--y);display:grid;place-items:center;color:#171717;font:800 17px Manrope,system-ui,sans-serif;letter-spacing:0}
.tag{font:800 11px "DM Sans",sans-serif;letter-spacing:.04em;text-transform:uppercase;background:var(--yp);color:#8a6a00;padding:3px 8px;border-radius:99px}

/* Layout: sidebar kiri */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:18px;z-index:40;overflow-y:auto}
.side .brand{padding:0 8px;gap:9px}
.grp{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 14px;margin:6px 0 4px}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:14px;border:1.5px solid transparent;background:none;font-weight:600;font-size:14.5px;color:#414955}
.nav button:hover{background:var(--bg)}
.nav button.on{background:none;border-color:transparent;color:var(--yd);font-weight:800}
.nav .bd{margin-left:auto;background:var(--y);color:var(--ink);font-size:11px;font-weight:800;border-radius:99px;min-width:22px;padding:0 6px;text-align:center;line-height:18px}
.sideFoot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:0 6px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--y);color:var(--ink);display:grid;place-items:center;font:800 14px Manrope,system-ui,sans-serif;flex:none}
.me div{min-width:0;line-height:1.3}.me b{display:block;font-size:13px}.me div span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{display:none;position:sticky;top:0;z-index:30;height:58px;align-items:center;gap:12px;padding:0 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:0;background:none}.ib:hover{background:var(--bg)}
.scrim{display:none}
.content{min-width:0}
main{max-width:1180px;margin:0 auto;padding:28px 28px 90px}
main>h1,.ph h1{font-size:28px}.ph{margin-bottom:18px}.ph p{margin:6px 0 0;color:var(--mut)}
.mut{color:var(--mut)}

/* Komponen */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border:1.5px solid var(--line);background:#fff;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s,transform .15s}
.btn:hover{border-color:var(--ink)}.btn:active{transform:translateY(1px)}
.btn.y{background:var(--y);border-color:var(--y)}.btn.y:hover{background:#ffd84b;border-color:#ffd84b}
.btn.p{background:var(--y);color:var(--ink);border-color:var(--y)}.btn.p:hover{background:#ffd84b;border-color:#ffd84b}
.btn.d{color:var(--bad)}.btn.d:hover{border-color:var(--bad)}
.btn.s{min-height:32px;padding:0 12px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;margin:2px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700}
.chip.ok{background:var(--okbg);border-color:#bfe5cd;color:#13703c}
.chip.bad{background:var(--badbg);border-color:#f3c5c5;color:#a52f2f}
.chip.y{background:var(--yp);border-color:#f0dc8a}
.seg{display:inline-flex;background:#eceff3;border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 15px;border-radius:99px;font-weight:700;font-size:13px;color:#4b5563}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;background:#fafafa;font-weight:800}
td img{width:38px;height:38px;object-fit:cover;border-radius:8px;display:block}
input,select,textarea{width:100%;min-height:44px;border:1.5px solid #cfd5dd;border-radius:12px;padding:9px 13px;background:#fff;transition:border-color .15s}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(244,198,47,.55)}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto;min-height:0}
.err{background:var(--badbg);border:1px solid #f3c5c5;color:#a52f2f;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.pv{max-width:160px;max-height:120px;border-radius:8px;margin-top:6px;display:block}

/* Modal ala web utama */
.ov{position:fixed;inset:0;background:rgba(25,27,32,.55);display:grid;place-items:center;z-index:60;padding:16px}
.md{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.18);width:min(640px,100%);max-height:92vh;overflow:auto;padding:24px}
.md h3{margin:0 0 4px;font-size:20px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* Dasbor */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:18px}
.kpi{display:flex;gap:14px;align-items:center;padding:16px}
.kpi .ico{width:44px;height:44px;border-radius:12px;background:var(--y);display:grid;place-items:center;flex:none}
.kpi small{display:block;color:var(--mut);font-weight:600;font-size:12.5px}
.kpi b{display:block;font:800 24px Manrope,system-ui,sans-serif;letter-spacing:-.04em;line-height:1.2}
.kpi.hl{background:var(--y);border-color:var(--y)}
.kpi.hl .ico{background:#fff}.kpi.hl small{color:#3d3820}
.g2{display:grid;gap:14px;grid-template-columns:1.6fr 1fr;margin-bottom:14px}
.g2e{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:14px}.g2e.last{grid-template-columns:1fr 1.5fr}.nw td{white-space:nowrap}
.ch h3{font-size:16px}.ch .sub{color:var(--mut);font-size:12.5px;margin:2px 0 12px}
.ch svg{width:100%;height:auto;display:block}
.ch .ax{font:600 11px "DM Sans",sans-serif;fill:#68717f}
.hb{display:grid;gap:11px}.hb .r{display:grid;grid-template-columns:150px 1fr 38px;gap:10px;align-items:center;font-size:13px;font-weight:600}
.hb .t{height:12px;border-radius:99px;background:#eceff3;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--y);border-radius:99px}
.hb .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .r span:last-child{text-align:right;font-weight:800}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dn svg{width:150px;flex:none}
.lg2{display:grid;gap:7px;font-size:13px;font-weight:600;min-width:0;flex:1}.lg2 div{display:flex;align-items:center;gap:8px}.lg2 i{width:11px;height:11px;border-radius:4px;flex:none}.lg2 b{margin-left:auto}
.empty{border:1.5px dashed #cfd5dd;border-radius:var(--r);padding:22px;text-align:center;color:var(--mut)}
.card .hd{padding:16px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px}.card .hd h3{font-size:16px}
.note{background:var(--yp);border:1px solid #f0dc8a;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}

/* Login ala halaman masuk web utama */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.authSide{background:var(--y);padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.authSide:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.26);right:-140px;bottom:-150px}
.authSide h1{font-size:clamp(32px,4vw,46px);letter-spacing:-.055em;max-width:480px;margin:0 0 14px}
.authSide p{max-width:420px;color:#48412c;font-size:16px;line-height:1.6;margin:0}
.authForm{display:flex;align-items:center;justify-content:center;padding:36px 24px;background:#fff}
.authBox{width:min(400px,100%)}.authBox h2{font-size:28px;margin-bottom:4px}

@media(max-width:1000px){.g2,.g2e,.g2e.last{grid-template-columns:1fr}}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}.kpi{padding:12px;gap:10px}.kpi .ico{width:38px;height:38px}.kpi b{font-size:19px}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .2s;box-shadow:none}
 .app.open .side{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.18)}
 .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(25,27,32,.45);z-index:35}
 .top{display:flex}
 main{padding:20px 16px 90px}
 .auth{grid-template-columns:1fr}.authSide{display:none}
}
@media(max-width:560px){.hb .r{grid-template-columns:110px 1fr 34px}}

const CFG={URL:'https://azjseobcambbbllqlqxx.supabase.co',KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6anNlb2JjYW1iYmJsbHFscXh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwOTYwMzAsImV4cCI6MjEwNjY3MjAzMH0.vZITnNh_K2vy7a78gpZyhHnLdHtzTn5ahe_3ARIMt18',BUCKET:'media'}; // isi KEY = anon/publishable key
const SB=supabase.createClient(CFG.URL,CFG.KEY||'x');
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUBS={pu:'Penalaran Umum',ppu:'Pengetahuan dan Pemahaman Umum',pbm:'Pemahaman Bacaan dan Menulis',pk:'Pengetahuan Kuantitatif',lbi:'Literasi B. Indonesia',lbe:'Literasi B. Inggris',pm:'Penalaran Matematika',twk:'TWK',tiu:'TIU',tkp:'TKP',tpav:'TPA Verbal',tpan:'TPA Numerik'};

function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md">${h}</div>`;o.onclick=e=>{if(e.target===o)o.remove()};document.body.append(o);return o}

/* ===== Definisi resource (CRUD generik) ===== */
const R={
 questions:{t:'Soal',pk:['id'],order:'created_at',
  cols:[['image_url','Gbr','i'],['subtest','Subtes','s'],['kind','Jenis'],['tryout_id','Tryout'],['text','Soal','t'],['active','Aktif','b']],
  f:[{k:'subtest',l:'Subtes',t:'sel',o:SUBS},{k:'kind',l:'Jenis',t:'sel',o:{tryout:'Tryout',drill:'Latihan soal'}},{k:'tryout_id',l:'ID Tryout (wajib bila jenis Tryout)',t:'txt'},
   {k:'passage',l:'Bacaan / stimulus (opsional)',t:'ta'},{k:'text',l:'Teks soal',t:'ta',req:1},{k:'image_url',l:'Gambar soal',t:'img'},
   {k:'options',l:'Opsi jawaban (satu per baris)',t:'lines',req:1},{k:'answer',l:'Nomor jawaban benar (1 = opsi pertama)',t:'idx',req:1},
   {k:'points',l:'Poin tiap opsi, khusus TKP (satu per baris, boleh kosong)',t:'nums'},{k:'explanation',l:'Pembahasan',t:'ta'},{k:'active',l:'Aktif',t:'bool',d:true}],
  check:o=>o.options.length<2?'Minimal 2 opsi.':o.answer<0||o.answer>=o.options.length?'Nomor jawaban di luar jumlah opsi.':o.points&&o.points.length!==o.options.length?'Jumlah poin harus sama dengan jumlah opsi.':o.kind==='tryout'&&!o.tryout_id?'Isi ID Tryout.':''},
 tryouts:{t:'Tryout',pk:['id'],order:'created_at',
  cols:[['image_url','Gbr','i'],['id','ID'],['title','Judul'],['jalur','Jalur'],['access','Akses'],['active','Aktif','b']],
  f:[{k:'id',l:'ID (huruf kecil, tanpa spasi; tidak bisa diubah)',t:'txt',req:1,lock:1},{k:'title',l:'Judul',t:'txt',req:1},{k:'jalur',l:'Jalur',t:'sel',o:JAL},
   {k:'access',l:'Akses',t:'sel',o:{free:'Gratis',premium:'Premium'}},{k:'subs',l:'Kode subtes (satu per baris, mis. pu, pk, lbi)',t:'lines'},
   {k:'tries',l:'Batas percobaan (kosong = tanpa batas)',t:'num'},{k:'image_url',l:'Gambar kartu',t:'img'},{k:'active',l:'Aktif',t:'bool',d:true}]},
 profiles:{t:'Pengguna',pk:['id'],noAdd:1,noDel:1,
  cols:[['email','Email'],['name','Nama'],['pkgs','Paket','p'],['jalur','Jalur'],['sekolah','Sekolah'],['xp','XP']],
  f:[{k:'name',l:'Nama',t:'txt',req:1},{k:'jalur',l:'Jalur',t:'sel',o:JAL},{k:'tahun',l:'Tahun target',t:'num'},{k:'goal',l:'Target',t:'num'},{k:'sekolah',l:'Sekolah',t:'txt'},{k:'xp',l:'XP',t:'num'},{k:'onboarded',l:'Sudah onboarding',t:'bool'}],
  extra:[['Paket',x=>crud('entitlements',{user_id:x.id})],['Hasil',x=>results(x.id)]]},
 entitlements:{t:'Akses paket',pk:['user_id','package_id'],
  cols:[['who','Pengguna'],['package_id','Paket'],['ends_at','Berakhir','d']],
  f:[{k:'user_id',l:'User ID',t:'txt',req:1},{k:'package_id',l:'ID paket (mis. utbk27)',t:'txt',req:1},{k:'ends_at',l:'Berakhir (kosong = selamanya)',t:'date'}]}
};
const pkOf=(r,x)=>Object.fromEntries(r.pk.map(k=>[k,x[k]]));
function cell(v,k){if(k==='p'){const n=Date.now();return v&&v.length?v.map(z=>`<span class="chip" style="${!z.ends_at||new Date(z.ends_at)>n?'background:#fff7d7':'opacity:.55'}">${esc(z.package_id)}${!z.ends_at||new Date(z.ends_at)>n?'':' (habis)'}</span>`).join(''):'<span class="mut">Gratis</span>'}if(k==='i')return v?`<img src="${esc(v)}" alt="">`:'';if(k==='b')return v?'✓':'–';if(k==='t')return esc(String(v||'').slice(0,70));if(k==='d')return v?esc(fmt(v)):'∞';if(k==='s')return esc(SUBS[v]||v);return esc(v)}
async function load(n,filter){
 let q=SB.from(n).select('*').limit(1000);if(filter)q=q.match(filter);if(R[n].order)q=q.order(R[n].order,{ascending:false});
 const {data,error}=await q;if(error)throw error;
 if(n==='profiles'||n==='entitlements'){const u=await SB.rpc('admin_users'),m=Object.fromEntries((u.data||[]).map(x=>[x.id,x.email]));
  if(n==='profiles'){const e=await SB.from('entitlements').select('user_id,package_id,ends_at'),pk={};(e.data||[]).forEach(z=>(pk[z.user_id]=pk[z.user_id]||[]).push(z));data.forEach(x=>{x.email=m[x.id]||'';x.pkgs=pk[x.id]||[]})}
  else{const p=await SB.from('profiles').select('id,name'),nm=Object.fromEntries((p.data||[]).map(x=>[x.id,x.name]));data.forEach(x=>x.who=[nm[x.user_id],m[x.user_id]].filter(Boolean).join(' · ')||x.user_id)}}
 return data}
async function upload(file){
 if(file.size>3e6)throw new Error('Ukuran gambar maksimal 3 MB.');
 const ext=(file.name.split('.').pop()||'png').toLowerCase(),path=`${new Date().getFullYear()}/${crypto.randomUUID()}.${ext}`;
 const {error}=await SB.storage.from(CFG.BUCKET).upload(path,file,{cacheControl:'31536000'});if(error)throw error;
 return SB.storage.from(CFG.BUCKET).getPublicUrl(path).data.publicUrl}

/* ===== Daftar + form CRUD ===== */
async function crud(n,filter){
 const r=R[n];main.innerHTML='<p class="mut">Memuat…</p>';let rows;
 try{rows=await load(n,filter)}catch(e){return main.innerHTML=`<div class="err">${esc(e.message)}<br>Pastikan admin-schema.sql sudah dijalankan.</div>`}
 main.innerHTML=`<h1>${r.t}${filter?' (terfilter)':''}</h1><div class="bar"><input id="q" placeholder="Cari…" style="max-width:260px">${r.noAdd?'':'<button class="btn y" id="add">+ Tambah</button>'}${filter?'<button class="btn" id="all">Lihat semua</button>':''}<span class="mut" id="cn"></span></div><div class="card tw" id="tb"></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase(),L=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#cn').textContent=L.length+' data';
  $('#tb').innerHTML=`<table><tr>${r.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>${L.map(x=>{const i=rows.indexOf(x);return `<tr>${r.cols.map(c=>`<td>${cell(x[c[0]],c[2])}</td>`).join('')}<td style="white-space:nowrap">${(r.extra||[]).map((e,j)=>`<button class="btn s" data-x="${j}" data-i="${i}">${e[0]}</button>`).join(' ')} <button class="btn s" data-e="${i}">Edit</button>${r.noDel?'':` <button class="btn s d" data-d="${i}">Hapus</button>`}</td></tr>`}).join('')||'<tr><td class="mut">Belum ada data.</td></tr>'}</table>`};
 draw();$('#q').oninput=draw;if($('#all'))$('#all').onclick=()=>crud(n);if($('#add'))$('#add').onclick=()=>form(n,null,filter);
 $('#tb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.e!=null)form(n,rows[d.e],filter);
  else if(d.x!=null)r.extra[d.x][1](rows[d.i]);
  else if(d.d!=null&&confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.')){const {error}=await SB.from(n).delete().match(pkOf(r,rows[d.d]));error?toast(error.message):(toast('Terhapus'),crud(n,filter))}}}
function form(n,row,filter){
 const r=R[n],d=row||{},fs=r.f.filter(f=>!(filter&&f.k in filter));
 const inp=f=>{let v=d[f.k];if(v==null)v=row?'':(f.d??'');const nm=`name="${f.k}"`;
  if(f.t==='txt')return `<input ${nm} value="${esc(v)}" ${f.lock&&row?'disabled':''}>`;
  if(f.t==='ta')return `<textarea ${nm}>${esc(v)}</textarea>`;
  if(f.t==='num')return `<input ${nm} type="number" value="${esc(v)}">`;
  if(f.t==='idx')return `<input ${nm} type="number" min="1" value="${row?d.answer+1:''}">`;

/* ===== Chart SVG (tanpa library) ===== */
const DAY=864e5,dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function series(n,items,getT,getV){const o=[],idx={},now=Date.now();
 for(let i=n-1;i>=0;i--){const t=now-i*DAY;idx[dk(t)]=o.length;o.push({l:new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'}),v:0})}
 items.forEach(x=>{const k=dk(getT(x));if(k in idx)o[idx[k]].v+=getV(x)});return o}
function niceMax(m){if(m<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function plot(pts,type,fy){
 const W=640,H=230,L=52,R=14,T=14,B=30,mx=niceMax(Math.max(...pts.map(p=>p.v),1)),n=pts.length,iw=W-L-R,ih=H-T-B;
 const X=i=>L+(n===1?iw/2:i*iw/(n-1)),Y=v=>T+ih-(v/mx)*ih;let g='';
 for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e5e8ed"/><text class="ax" x="${L-8}" y="${y+4}" text-anchor="end">${fy(v)}</text>`}
 const st=Math.ceil(n/6);pts.forEach((p,i)=>{if(i%st===0||i===n-1)g+=`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${p.l}</text>`});
 if(type==='bar'){const bw=Math.min(22,iw/n*.62);pts.forEach((p,i)=>{const h=(p.v/mx)*ih;g+=`<rect x="${X(i)-bw/2}" y="${T+ih-h}" width="${bw}" height="${Math.max(h,p.v?2:0)}" rx="4" fill="#f4c62f"><title>${p.l}: ${fy(p.v)}</title></rect>`})}
 else{const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  g+=`<path d="${d} L${X(n-1)} ${T+ih} L${X(0)} ${T+ih}Z" fill="#fff7d7"/><path d="${d}" fill="none" stroke="#e5b419" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${n<=16?4.5:3}" fill="#fff" stroke="#e5b419" stroke-width="2.5"><title>${p.l}: ${fy(p.v)}</title></circle>`})}
 return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}
function hbar(items){const m=Math.max(...items.map(x=>x[1]),1);return `<div class="hb">${items.map(([l,v])=>`<div class="r"><span title="${esc(l)}">${esc(l)}</span><div class="t"><i style="width:${Math.max(v/m*100,3)}%"></i></div><span>${v}</span></div>`).join('')}</div>`}
const PAL=['#f4c62f','#f9dc78','#c99a00','#fbe9a6','#e5b419','#fdf2c6','#a07d00','#ffd84b'];
function donut(items){const tot=items.reduce((s,x)=>s+x[1],0)||1,r=54,C=2*Math.PI*r;let off=0,s='';
 items.forEach(([l,v],i)=>{const len=v/tot*C;s+=`<circle r="${r}" cx="75" cy="75" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="24" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len});
 return `<div class="dn"><svg viewBox="0 0 150 150" role="img"><circle r="${r}" cx="75" cy="75" fill="none" stroke="#eceff3" stroke-width="24"/>${s}<text x="75" y="73" text-anchor="middle" style="font:800 24px Manrope,sans-serif" fill="#191b20">${items.reduce((a,x)=>a+x[1],0)}</text><text x="75" y="91" text-anchor="middle" class="ax">total</text></svg>
 <div class="lg2">${items.map(([l,v],i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${esc(l)}</span><b>${v}</b></div>`).join('')}</div></div>`}

/* ===== Shell (sidebar kiri), login ===== */
let main,ME='';
const NAV=[['Utama',[['dash','Dasbor','home'],['orders','Pesanan','wallet']]],['Konten',[['questions','Soal','drill'],['tryouts','Tryout','tryout']]],['Pengguna',[['profiles','Pengguna','users'],['results','Hasil tryout','chart'],['entitlements','Akses paket','key']]]];
function go(t){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('.app').classList.remove('open');main.onclick=null;window.scrollTo(0,0);
 t==='dash'?dash():t==='orders'?orders():t==='results'?results():crud(t)}
function shell(){
 $('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="brandMark">C</span>cognera <span class="tag">Admin</span></div>
 <nav class="nav">${NAV.map(([g,it])=>`<div class="grp">${g}</div>${it.map(t=>`<button data-t="${t[0]}">${ic(t[2])}${t[1]}${t[0]==='orders'?'<span class="bd" id="bd-orders" hidden></span>':''}</button>`).join('')}`).join('')}</nav>
 <div class="sideFoot"><div class="me"><span class="av">${esc((ME[0]||'A').toUpperCase())}</span><div><b>Admin</b><span>${esc(ME)}</span></div></div><button class="btn" id="out">${ic('out')}Keluar</button></div></aside>
 <div class="scrim" id="scrim"></div>
 <div class="content"><header class="top"><button class="ib" id="mb" aria-label="Buka menu">${ic('menu')}</button><span class="brand" style="font-size:19px"><span class="brandMark" style="width:26px;height:26px;font-size:14px">C</span>admin</span></header><main id="main"></main></div></div>`;
 main=$('#main');
 $('.nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
 $('#mb').onclick=()=>$('.app').classList.add('open');$('#scrim').onclick=()=>$('.app').classList.remove('open');
 $('#out').onclick=async()=>{await SB.auth.signOut();login()};go('dash');badge()}
function login(msg){
 $('#app').innerHTML=`<div class="auth"><div class="authSide"><div class="brand"><span class="brandMark" style="background:#fff">C</span>cognera</div><div><h1>Kelola Cognera dari satu tempat.</h1><p>Soal, tryout, pengguna, dan pesanan paket. Masuk dengan akun admin.</p></div><span></span></div>
 <div class="authForm"><form class="authBox"><h2>Masuk admin</h2><p class="mut" style="margin:0 0 6px">Khusus pengelola Cognera.</p><label>Email</label><input name="e" type="email" required autocomplete="username"><label>Kata sandi</label><input name="p" type="password" required autocomplete="current-password"><div id="le">${msg?`<div class="err">${esc(msg)}</div>`:''}</div><button class="btn p" style="width:100%;margin-top:20px;min-height:46px">Masuk</button></form></div></div>`;
 $('form').onsubmit=async e=>{e.preventDefault();const f=e.target.elements,{error}=await SB.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});
  if(error)return $('#le').innerHTML='<div class="err">Email atau kata sandi salah.</div>';boot()}}
async function boot(){
 if(!CFG.KEY)return $('#app').innerHTML='<div class="authForm" style="min-height:100vh"><div class="card"><b>Isi CFG.KEY di admin.html</b> dengan anon/publishable key Supabase.</div></div>';
 const {data}=await SB.auth.getSession();if(!data.session)return login();
 const a=await SB.from('admins').select('user_id').eq('user_id',data.session.user.id).maybeSingle();
 if(!a.data){await SB.auth.signOut();return login('Akun ini bukan admin.')}ME=data.session.user.email||'';shell()}
boot();
</script></body></html>
