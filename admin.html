async function managerHTML(table){const cfg=tables[table];let rows=await safe(table,'*',1000);state.rows=rows;state.table=table;let cols=cfg.cols.filter(c=>rows.some(r=>c in r)||c==='id');if(!rows.length)cols=cfg.cols;return `<div class="section-head"><div><h2>${cfg.icon} ${cfg.label}</h2><div class="muted">Kelola data ${cfg.label.toLowerCase()} langsung dari database.</div></div>${cfg.add!==false?'<button class="btn y" id="add">+ Tambah</button>':''}</div><div class="card"><div class="cardbody"><div class="toolbar"><input class="grow" id="filter" placeholder="Cari di data…"><button class="btn" id="refresh">↻ Refresh</button><button class="btn" id="export">Export CSV</button></div><div class="tablewrap"><table id="dataTable"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${renderRows(rows,cols,cfg)}</tbody></table></div></div></div>`}
function renderRows(rows,cols,cfg){let filtered=rows.filter(r=>!state.search||JSON.stringify(r).toLowerCase().includes(state.search.toLowerCase()));if(!filtered.length)return `<tr><td colspan="${cols.length+1}" class="empty">Belum ada data.</td></tr>`;return filtered.slice(0,500).map((r,i)=>`<tr>${cols.map(c=>`<td>${cell(r[c],c)}</td>`).join('')}<td><button class="btn sm" data-edit="${i}">Edit</button> ${cfg.pk&&cfg.pk!=='id'?'':'<button class="btn sm red" data-del="'+i+'">Hapus</button>'}</td></tr>`).join('')}

async function bindManager(table){const cfg=tables[table];const filter=document.querySelector('#filter');filter.oninput=e=>{state.search=e.target.value;document.querySelector('#dataTable tbody').innerHTML=renderRows(state.rows,cfg.cols.filter(c=>state.rows.some(r=>c in r)||c==='id'),cfg)};document.querySelector('#refresh').onclick=()=>loadManager(table);document.querySelector('#export').onclick=()=>downloadCSV(state.rows,table+'.csv');if(document.querySelector('#add'))document.querySelector('#add').onclick=()=>editModal(table,null);document.querySelector('#dataTable').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=Number(b.dataset.edit??b.dataset.del);const filtered=state.rows.filter(r=>!state.search||JSON.stringify(r).toLowerCase().includes(state.search.toLowerCase()));if(b.dataset.edit!=null)editModal(table,filtered[i]);if(b.dataset.del!=null)deleteRow(table,filtered[i])}}

async function editModal(table,row){const cfg=tables[table];let cols=cfg.cols.filter(c=>!row||c in row);if(!row){cols=cfg.cols.filter(c=>!['id','created_at','updated_at'].includes(c));}const body=`<form id="editForm"><div class="formgrid">${cols.map(c=>fieldFor(c,row?.[c])).join('')}</div></form>`;const m=modal(row?'Edit ':'Tambah '+cfg.label,body,'<button class="btn" data-close>Batal</button><button class="btn y" id="save">Simpan</button>');m.querySelector('#save').onclick=async()=>{const f=m.querySelector('form');const o={};cols.forEach(c=>{const el=f.elements[c];if(!el)return;o[c]=el.type==='checkbox'?el.checked:(el.value===''?null:el.value);if(['amount','price','strike','months','tries','pct','flat','vat_pct','round_to','sort','xp','goal','tahun'].includes(c)&&o[c]!=null)o[c]=Number(o[c])});let q=row?SB.from(table).update(o).eq(cfg.pk,row[cfg.pk]):SB.from(table).insert(o);const r=await q;if(r.error)return toast(r.error.message);m.remove();toast('Data tersimpan');loadManager(table)} }
async function deleteRow(table,row){if(!row||!confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.'))return;const pk=tables[table].pk;const r=await SB.from(table).delete().eq(pk,row[pk]);if(r.error)return toast(r.error.message);toast('Data dihapus');loadManager(table)}
function downloadCSV(rows,name){if(!rows.length)return toast('Tidak ada data untuk diekspor.');const cols=[...new Set(rows.flatMap(x=>Object.keys(x)))];const csv=[cols.join(','),...rows.map(r=>cols.map(c=>`"${String(Array.isArray(r[c])?r[c].length:r[c]??'').replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}

async function importPdfPage(){
 page.innerHTML=`<div class="section-head"><div><h2>Import soal dari PDF</h2><div class="muted">Upload PDF soal + kunci, analisis di browser, review hasilnya, lalu simpan sebagai draft atau publish.</div></div></div>

 <div class="formgrid" style="margin-top:15px"><div class="field"><label>Nama tryout</label><input id="impTitle" placeholder="Tryout UTBK 2026"></div><div class="field"><label>Jalur</label><select id="impJalur"><option value="utbk">UTBK</option><option value="kedinasan">Kedinasan</option><option value="mandiri">Mandiri</option></select></div><div class="field"><label>Subtes default</label><select id="impSub"><option value="pu">Penalaran Umum</option><option value="ppu">PPU</option><option value="pbm">PBM</option><option value="pk">PK</option><option value="lbi">Literasi Bahasa Indonesia</option><option value="lbe">Literasi Bahasa Inggris</option><option value="pm">Penalaran Matematika</option></select></div><div class="field"><label>File kunci (opsional)</label><input id="keyFile" type="file" accept="application/pdf,.txt,.csv"></div></div>
 <button class="btn y" id="analyzePdf" style="margin-top:14px">Analisis PDF</button></div></div>
 <div class="card"><div class="cardhead"><b>2. Status parser</b><span id="parseBadge" class="badge">Belum ada file</span></div><div class="cardbody" id="parseStatus"><div class="empty">Belum ada PDF yang dianalisis.</div></div></div></div>
 <div class="card" style="margin-top:16px"><div class="cardhead"><b>3. Review soal</b><div style="display:flex;gap:8px"><button class="btn sm" id="exportParsed">Export CSV</button><button class="btn y sm" id="saveParsed">Simpan ke bank soal</button></div></div><div class="cardbody"><div class="toolbar"><input class="grow" id="parsedSearch" placeholder="Cari nomor, teks, atau kunci…"><select id="parsedFilter"><option value="all">Semua status</option><option value="valid">Valid</option><option value="warn">Perlu review</option></select></div><div class="tablewrap"><table id="parsedTable"><thead><tr><th>No</th><th>Soal</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>Kunci</th><th>Status</th></tr></thead><tbody><tr><td colspan="9" class="empty">Hasil analisis akan muncul di sini.</td></tr></tbody></table></div></div></div>`;
 let parsed=[];
 const status=msg=>{document.querySelector('#parseStatus').innerHTML=msg};
 const renderParsed=()=>{const q=(document.querySelector('#parsedSearch').value||'').toLowerCase(),f=document.querySelector('#parsedFilter').value;const rows=parsed.filter(x=>(f==='all'||x.status===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.querySelector('#parsedTable tbody').innerHTML=rows.length?rows.map(x=>`<tr><td>${x.no}</td><td style="min-width:280px">${esc(x.text.slice(0,260))}${x.text.length>260?'…':''}</td><td>${esc(x.a)}</td><td>${esc(x.b)}</td><td>${esc(x.c)}</td><td>${esc(x.d)}</td><td>${esc(x.e)}</td><td><b>${esc(x.answer||'—')}</b></td><td>${x.status==='valid'?'<span class="badge g">Valid</span>':'<span class="badge y">Perlu review</span>'}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">Tidak ada hasil.</td></tr>'};

 document.querySelector('#saveParsed').onclick=async()=>{if(!parsed.length)return toast('Belum ada soal hasil analisis.');const title=document.querySelector('#impTitle').value.trim()||'Import PDF';const valid=parsed.filter(x=>x.status==='valid');if(!valid.length)return toast('Tidak ada soal valid untuk disimpan.');const payload=valid.map(x=>({subtest:document.querySelector('#impSub').value,kind:'mcq',text:x.text,option_a:x.a,option_b:x.b,option_c:x.c,option_d:x.d,option_e:x.e,correct_answer:x.answer,active:false}));const r=await SB.from('questions').insert(payload);if(r.error)return toast('Belum tersimpan: '+r.error.message);toast(`${valid.length} soal disimpan sebagai draft. ${title}`)};

async function parsePdfQuestions(file,keyFile){
 if(!window.pdfjsLib){throw new Error('PDF parser belum siap. Pastikan koneksi internet tersedia untuk memuat PDF.js.')}
 const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let pages=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();pages.push(tc.items.map(x=>x.str).join(' '))}let text=pages.join('\n');let keyText='';if(keyFile){if(keyFile.type==='application/pdf'){const kb=await keyFile.arrayBuffer();const kp=await pdfjsLib.getDocument({data:kb}).promise;for(let i=1;i<=kp.numPages;i++){const p=await kp.getPage(i);const tc=await p.getTextContent();keyText+='\n'+tc.items.map(x=>x.str).join(' ')}}else keyText=await keyFile.text()}
 const answers={};const km=keyText.matchAll(/(?:^|\s)(\d{1,3})\s*[:.)-]?\s*([ABCDE])(?=\s|$)/gi);for(const m of km)answers[Number(m[1])]=m[2].toUpperCase();
 const re=/(?:^|\n|\s)(\d{1,3})[.)]\s+([\s\S]*?)(?=(?:\n|\s)\d{1,3}[.)]\s+|$)/g;let out=[],m;while((m=re.exec(text))){let block=m[2].replace(/\s+/g,' ').trim();const opts={};for(const l of ['A','B','C','D','E']){const next=String.fromCharCode(l.charCodeAt(0)+1);const rx=new RegExp('\\b'+l+'[.)]\\s+([\\s\\S]*?)(?=\\s'+next+'[.)]\\s+|$)','i');const mm=block.match(rx);if(mm)opts[l.toLowerCase()]=mm[1].trim()}let q=block.replace(/\s+[ABCDE][.)]\s+[\s\S]*$/i,'').trim();let ans=answers[Number(m[1])]||'';const complete=q.length>12&&opts.a&&opts.b&&opts.c&&opts.d&&(opts.e||true);out.push({no:Number(m[1]),text:q,a:opts.a||'',b:opts.b||'',c:opts.c||'',d:opts.d||'',e:opts.e||'',answer:ans,status:complete&&ans?'valid':'warn'});}
 if(!out.length){const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);let no=0;for(let i=0;i<lines.length;i++){const mm=lines[i].match(/^(\d{1,3})[.)]\s*(.+)$/);if(mm){no=Number(mm[1]);out.push({no,text:mm[2],a:'',b:'',c:'',d:'',e:'',answer:answers[no]||'',status:answers[no]?'valid':'warn'})}}}
 return out;
}
