<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4c62f">
<title>Cognera App — Tryout dan Latihan Soal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--yellow:#f4c62f;--yellow-deep:#e5b419;--yellow-pale:#fff7d7;--ink:#191b20;--muted:#68717f;--line:#e5e8ed;--bg:#f7f7f7;--white:#fff;--ok:#1f9d55;--ok-bg:#e6f6ec;--bad:#d64545;--bad-bg:#fdecec;--radius:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Manrope,"DM Sans",sans-serif;letter-spacing:-.03em;margin:0;line-height:1.15}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;font-weight:700;font-size:14px;transition:background .15s,transform .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{background:#000}
.btn-yellow{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 rgba(170,132,0,.25)}.btn-yellow:hover{background:#ffd84b}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Brand */
.brand{display:flex;align-items:center;gap:9px;font:800 22px Manrope,system-ui,sans-serif;letter-spacing:-1px}
.brandMark{width:30px;height:30px;border-radius:9px;background:var(--yellow);display:grid;place-items:center;color:#171717;font:800 17px Manrope,system-ui,sans-serif}

/* Top nav */
.nav{position:sticky;top:0;z-index:30;background:#fff;box-shadow:0 2px 14px rgba(16,30,52,.08)}
.navIn{height:64px;display:flex;align-items:center;gap:18px}
.navLinks{display:flex;gap:2px;margin-left:12px;flex:1}
.navLinks a{padding:8px 13px;border-radius:99px;font-size:13.5px;font-weight:600;color:#414955;white-space:nowrap}
.navLinks a:hover{background:var(--bg)}
.navLinks a.on{background:var(--yellow);color:var(--ink);font-weight:800}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font:800 14px Manrope,system-ui,sans-serif;overflow:hidden;flex:none}
.avatar img,.pa img{width:100%;height:100%;object-fit:cover;display:block}
.pRow{display:flex;gap:12px}.pRow .pa{flex:0 0 auto}.pact{display:flex;align-items:center;gap:22px;margin-top:10px}
.pbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);padding:4px;cursor:pointer;font:inherit;font-size:14px;border-radius:8px}.pbtn:hover{color:var(--ink)}.pbtn.pl{color:#e0245e}.pbtn.po,.pbtn.ps{color:var(--ink)}.pact .sv{margin-left:auto}.pRep{margin-top:6px}
.cgHead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.cgHead>b{flex:1;text-align:center}.cgHead #cq{flex:1;min-width:0}.cgSel{width:auto;max-width:46%;font-weight:700;border-radius:99px}
.cgBox{padding:0;overflow:hidden}.cgBox .post{border:0;border-radius:0;box-shadow:none;margin:0;background:none;padding:16px 18px;border-bottom:1px solid var(--line)}.cgBox .post:last-child{border-bottom:0}.post.clk{cursor:pointer}.post.clk:hover{background:rgba(0,0,0,.02)}.cgComp{margin-bottom:12px}
.cgText{margin:8px 0 0;white-space:pre-wrap;font-family:var(--cg-ff,inherit);font-size:var(--cg-fs,15px);line-height:var(--cg-lh,1.55);text-align:var(--cg-ta,left)}
.cgReply{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.cgReply .input{flex:1}.cgRep{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.cgRep p{margin:4px 0 0}
.cgr{width:100%;margin-top:10px;accent-color:var(--yellow,#f4c62f)}.cgPrev{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.avBig{position:relative;width:96px;height:96px;border-radius:50%;flex:none;padding:0}
.avBig .avatar{width:96px;height:96px;font-size:38px}
.avBig .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--yellow);border:3px solid #fff;display:grid;place-items:center}
.avBig .cam svg{width:15px;height:15px}
.avSheet{display:grid;gap:8px;margin-top:14px}
.avSheet .btn{width:100%;justify-content:center}
.avDanger{color:var(--bad)}
.avCv{display:block;margin:14px auto 0;border-radius:12px;cursor:grab;touch-action:none;max-width:100%;background:#eceff3}
.avCv:active{cursor:grabbing}
.avZoom{width:100%;accent-color:var(--ink);margin-top:14px}
.menuWrap{position:relative}
.menu{position:absolute;right:0;top:46px;background:#fff;border:1.5px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);min-width:210px;padding:6px;display:none}
.menu.open{display:block}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;text-align:left}
.menu a:hover,.menu button:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.tabbar{display:none}

/* Page */
main{padding:28px 0 90px;min-height:calc(100vh - 64px)}
.pageHead{margin-bottom:22px}
.pageHead h1{font-size:30px}
.pageHead p{color:var(--muted);margin:6px 0 0;max-width:620px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card h3{font-size:17px}
.card.pad0{padding:0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700}
.chip.y{background:var(--yellow-pale);border-color:#f0dc8a}
.chip.ok{background:var(--ok-bg);border-color:#bfe5cd;color:#13703c}
.chip.bad{background:var(--bad-bg);border-color:#f3c5c5;color:#a52f2f}
.chip.dark{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
.bar{height:10px;border-radius:99px;background:#eceff3;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.bar.y>i{background:var(--yellow-deep)}
.empty{border:1.5px dashed #cfd5dd;border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted)}

/* Mission (the one memorable thing) */
.mission{background:var(--yellow);border:2px solid var(--ink);border-radius:18px;box-shadow:7px 7px 0 var(--ink);padding:24px}
.mission h2{font-size:26px;margin:6px 0 4px}
.mission .bar{background:rgba(25,27,32,.15);height:12px;border:1.5px solid var(--ink)}
.mission .bar>i{background:var(--ink)}
.pips{display:flex;gap:8px;margin:14px 0}
.pip{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:#fff}
.pip.on{background:var(--ink);color:var(--yellow)}
.pip svg{width:16px;height:16px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.week span{display:block;width:100%;aspect-ratio:1;max-width:38px;margin:4px auto 0;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.week .on span{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.week .today{color:var(--ink)}

.tile{display:flex;flex-direction:column;gap:8px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);font-weight:700;font-size:14px;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tile .ico{width:38px;height:38px;border-radius:11px;background:var(--yellow);display:grid;place-items:center}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-weight:600}
.steps li .dot{width:22px;height:22px;border-radius:50%;border:2px solid #cfd5dd;display:grid;place-items:center;flex:none}
.steps li.done{color:var(--muted);text-decoration:line-through}
.steps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li .dot svg{width:12px;height:12px;stroke-width:3}

/* Tryout / list cards */
.tcard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tcard .art{height:84px;background:linear-gradient(125deg,var(--yellow),#ffe17d);padding:14px;display:flex;align-items:flex-start;justify-content:space-between}
.tcard.prem .art{background:linear-gradient(125deg,var(--ink),#3b3f48);color:var(--yellow)}
.tcard .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tcard h3{font-size:16px}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.tcard .foot{margin-top:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:#eceff3;border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 15px;border-radius:99px;font-weight:700;font-size:13px;color:#4b5563}
.seg button.on{background:var(--ink);color:#fff}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.authSide{background:var(--yellow);padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.authSide:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.26);right:-140px;bottom:-150px}
.authSide h1{font-size:clamp(34px,4vw,48px);letter-spacing:-.055em;max-width:520px;margin:0 0 16px}
.authSide p{max-width:440px;color:#48412c;font-size:16px;line-height:1.6;margin:0}
.authSide ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px;position:relative;z-index:1}
.authSide li{display:flex;gap:11px;align-items:flex-start;font-weight:600}
.authSide li i{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;flex:none;font-style:normal}
.authSide li svg{width:13px;height:13px;stroke-width:3}
.authForm{display:flex;align-items:center;justify-content:center;padding:36px 24px;background:#fff}
.authBox{width:min(400px,100%)}
.authBox h2{font-size:28px;margin-bottom:6px}
.field{display:block;margin-top:16px}
.field>span{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.input{width:100%;min-height:46px;border:1.5px solid #cfd5dd;border-radius:12px;padding:0 14px;background:#fff;transition:border-color .15s}
.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(244,198,47,.55)}
textarea.input{padding:12px 14px;min-height:92px;resize:vertical}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:7px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;color:var(--muted)}
.err{background:var(--bad-bg);border:1px solid #f3c5c5;color:#a52f2f;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:14px}
.ok-note{background:var(--ok-bg);border:1px solid #bfe5cd;color:#13703c;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:#414955}
.check input{margin-top:3px;accent-color:var(--ink);width:16px;height:16px}

/* Option cards (onboarding/drill/runner) */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:500;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink)}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid #cfd5dd;display:grid;place-items:center;font:800 12px Manrope,system-ui,sans-serif;flex:none}
.opt.sel{border-color:var(--ink);background:var(--yellow-pale)}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:var(--yellow)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opts{display:grid;gap:10px}
.passage{background:var(--bg);border-left:4px solid var(--yellow-deep);padding:14px 16px;border-radius:0 10px 10px 0;margin:0 0 16px;font-size:15px;line-height:1.65}
.qtext{font-size:17px;line-height:1.55;font-weight:600;margin-bottom:16px}
.explain{background:var(--yellow-pale);border:1px solid #f0dc8a;border-radius:12px;padding:14px 16px;margin-top:16px;font-size:14.5px;line-height:1.6}

/* Runner */
.runTop{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.runTopIn{height:60px;display:flex;align-items:center;gap:14px}
.timer{font:800 18px Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:6px 14px;border-radius:99px;background:var(--bg);border:1.5px solid var(--line)}
.timer.low{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.runGrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;padding:22px 0 100px}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.nb{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);font-weight:800;font-size:13px;background:#fff;position:relative}
.nb.ans{background:var(--ink);color:#fff;border-color:var(--ink)}
.nb.cur{outline:3px solid var(--yellow-deep);outline-offset:1px}
.nb.flag:after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-2px;margin-right:4px}
.runFoot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20}
.runFootIn{height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Result */
.scoreHero{background:var(--ink);color:#fff;border-radius:18px;padding:28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.scoreNum{font:800 64px Manrope,system-ui,sans-serif;letter-spacing:-.05em;color:var(--yellow);line-height:1}
.subrow{display:grid;grid-template-columns:200px 1fr 70px;gap:12px;align-items:center;padding:8px 0}
details.rv{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}
details.rv summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.rv summary::-webkit-details-marker{display:none}
details.rv .inner{padding:0 16px 16px}

/* Chart */
.spark{width:100%;height:150px}

/* Community / chat */
.post{padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.post+.post{margin-top:12px}
.pa{width:38px;height:38px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font:800 14px Manrope,system-ui,sans-serif;flex:none;overflow:hidden}
.chat{display:flex;flex-direction:column;gap:12px;min-height:340px;max-height:56vh;overflow:auto;padding:4px 2px}
.msg{max-width:84%;padding:12px 15px;border-radius:16px;line-height:1.6;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.n{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.n p{margin:0 0 8px}.msg.n p:last-child{margin:0}
.msg.n ul,.msg.n ol{margin:4px 0 8px;padding-left:20px}
.nera-badge{width:34px;height:34px;border-radius:10px;background:var(--yellow);display:grid;place-items:center}

/* Packages */
.price{font:800 26px Manrope,system-ui,sans-serif;letter-spacing:-.04em}
.strike{text-decoration:line-through;color:var(--muted);font-size:14px;margin-left:6px;font-weight:500}
.pk.owned{border:2px solid var(--ok)}

/* Lessons */
.lesson h3{margin:22px 0 8px;font-size:18px}
.lesson p,.lesson li{line-height:1.7}
.lesson code,.lesson .eq{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:14px}
.lesson .eq{display:block;padding:10px 14px;margin:8px 0;border-radius:10px}

/* Modal + toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);width:min(480px,100%);max-height:88vh;overflow:auto;padding:24px}
.modal h3{font-size:21px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.banner{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:8px 14px}
.banner b{color:var(--yellow)}

@media(max-width:900px){
  .navLinks{display:none}
  .nav .btn-nera{display:none}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .g-main,.g2{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .authSide{padding:28px 24px;min-height:0}
  .authSide ul{display:none}
  .authSide h1{font-size:30px}
  .runGrid{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:10px}
  .tabbar .on{color:var(--ink);background:var(--yellow-pale)}
  main{padding-bottom:100px}
  .scoreHero{grid-template-columns:1fr}
  .subrow{grid-template-columns:1fr 60px}.subrow .bar{grid-column:1/-1;order:3}
}
@media(max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .pageHead h1{font-size:25px}
  .mission{box-shadow:5px 5px 0 var(--ink);padding:18px}
  .navgrid{grid-template-columns:repeat(8,1fr)}
}

/* ===== Komunitas v2 + Profil ===== */
.cgWrap{max-width:1060px;margin:0 auto}
.cgTitle,.cgPage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.cgTitle{align-items:end;margin-bottom:18px}
.cgTitle h1{font-size:30px}.cgTitle p{margin:6px 0 0;color:var(--muted)}
.cgMain{min-width:0;display:grid;gap:14px}
.cgRail{position:sticky;top:84px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}

.cgBox{padding:0;overflow:hidden}

.cgTabs .t:hover{color:var(--ink)}

.cgComp{padding:16px 18px 12px;border-bottom:1px solid var(--line);margin:0}

.cgPill.fixed{background:var(--yellow-pale);border-color:#f0dc8a}
.cgGuest{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.cgBox .pa,.pf .pa{width:42px;height:42px}
a.pa:hover{opacity:.85}
.pHead{display:flex;align-items:flex-start;gap:8px}
.pWho{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.pName{font-weight:800}a.pName:hover{text-decoration:underline}

.uRow{display:flex;align-items:center;gap:11px;padding:9px 0}
.uMeta{display:flex;flex-direction:column;min-width:0}

.uMeta:hover b{text-decoration:underline}

.tRow{display:flex;align-items:center;gap:10px;padding:10px 0}
.popRow{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}

.cgSearch{position:relative}

.cgSearch>svg{position:absolute;left:15px;top:13px;color:var(--muted);pointer-events:none}
.cgRes{position:absolute;left:0;right:0;top:52px;z-index:25;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(16,30,52,.16);padding:6px 14px;max-height:380px;overflow:auto}

.cgTopicHead{display:flex;align-items:center;gap:12px;padding:16px 18px}

.cgTpc{display:flex;align-items:center;gap:10px;padding:16px 18px}

/* Profil */

.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ink)}.sw[aria-checked="true"]:after{transform:translateX(18px)}

.cgComp .ct{align-items:flex-start}

.cgRep{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);min-width:0}
.cgRep:last-child{border-bottom:0}
.cgReplyEmpty{padding:18px;color:var(--muted);font-size:13px;text-align:center;background:linear-gradient(180deg,#fff,#fffcf3)}
.cgRep .pa{width:36px;height:36px}

.cgRepActions .pbtn{font-size:12px;gap:4px;padding:3px 2px}

.cgRepActions .pbtn.pl{color:#e0245e}.cgRepActions .pbtn.ps{color:var(--ink)}
.cgRepRoot{position:relative}
/* Direct replies to the main post stay at the exact same left edge as the main reply list. */
.cgRepRoot>.cgRep{padding-left:18px}
.cgRepDescendants{margin:0;padding:0}
/* A reply-to-a-reply gets exactly ONE indentation level. No repeated staircase. */
.cgRepChildren{position:relative;margin:0 0 0 44px;padding:0;border:0}
.cgRepChildren:empty{display:none}
.cgRepNestedBranch{position:relative}

/* Curved connector: starts from the parent avatar area and lands beside the child avatar. */
.cgRepChildren>.cgRepNestedBranch>.cgRep:before{
  content:"";position:absolute;left:-30px;top:-19px;width:28px;height:37px;
  border-left:2px solid #d7d9de;border-bottom:2px solid #d7d9de;

}

.cgTopicDot{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px #fff8df;flex:none}

.cgTopicModalList{max-height:54vh;overflow:auto;padding-right:4px}

.cgImageBadge{display:inline-flex;align-items:center;gap:5px;color:#707784;font-size:11px;font-weight:700;margin-top:5px}
@media(max-width:1120px){

async function pullRemote(uid,name,email,pic,meta={}){
  // IMPORTANT: Supabase Auth is the source of truth. Set the local session
  // immediately so a temporary profiles/user_data query error can NEVER turn
  // an authenticated Google user back into Guest.
  const u={id:uid,name:name||email?.split('@')[0]||'User',email:email||'',username:meta.username||'',phone:meta.phone||'',sekolah:meta.sekolah||'',kelas:meta.kelas||''};
  const users=LS.get('users',[]).filter(x=>x.id!==uid); users.push(u); LS.set('users',users);
  LS.set('session',uid);
  const existing=LS.get('data:'+uid,null)||(LS.get('data:guest',null));
  const base=defaultData(u);
  if(existing){
    const seed=Object.assign(base,existing);
    seed.profile=Object.assign({},base.profile,existing.profile||{}, {name:(existing.profile&&existing.profile.name)||u.name,username:(existing.profile&&existing.profile.username)||u.username,phone:(existing.profile&&existing.profile.phone)||u.phone,sekolah:(existing.profile&&existing.profile.sekolah)||u.sekolah,kelas:(existing.profile&&existing.profile.kelas)||u.kelas});
    if(pic) seed.profile.gpic=pic;
    LS.set('data:'+uid,seed);
    LS.del('data:guest');
  } else {
    if(pic) base.profile.gpic=pic;
    LS.set('data:'+uid,base);
  }
  loadSession();

  // Remote profile/data are enrichment only. Authentication must not depend on them.
  try{
    const profileRes=await SB.from('profiles').upsert({id:uid,username:u.username||('user_'+String(uid).replace(/-/g,'').slice(0,8)),name:u.name,phone:u.phone||'',jalur:'utbk',tahun:2027,goal:3,sekolah:u.sekolah||'',kelas:u.kelas||'',xp:0,onboarded:false,avatar:pic||null},{onConflict:'id',ignoreDuplicates:true});
    if(profileRes.error) console.warn('profile bootstrap gagal',profileRes.error);
  }catch(profileErr){ console.warn('profile bootstrap gagal',profileErr); }

  try{
    const [d,e]=await Promise.all([
      SB.from('user_data').select('data').eq('user_id',uid).maybeSingle(),
      SB.from('entitlements').select('package_id,ends_at').eq('user_id',uid)
    ]);
    if(d.error) console.warn('user_data load gagal',d.error);

    const now=Date.now();
    const pk=(e.data||[]).filter(x=>!x.ends_at||new Date(x.ends_at).getTime()>now).map(x=>x.package_id);
    const remote=(d.data&&d.data.data)||{};
    const current=LS.get('data:'+uid,null)||defaultData(u);
    const merged=Object.assign(defaultData(u),current,remote.profile?remote:{},{packages:pk});
    merged.profile=Object.assign({},defaultData(u).profile,merged.profile||{},{name:(merged.profile&&merged.profile.name)||u.name,username:(merged.profile&&merged.profile.username)||u.username,phone:(merged.profile&&merged.profile.phone)||u.phone,sekolah:(merged.profile&&merged.profile.sekolah)||u.sekolah,kelas:(merged.profile&&merged.profile.kelas)||u.kelas});
    if(pic) merged.profile.gpic=pic;
    LS.set('data:'+uid,merged);
    loadSession();
  }catch(remoteErr){ console.warn('remote bootstrap gagal, tetap login sebagai user',remoteErr); }
}

async function hashPw(pw,salt){
  try{
    if(window.crypto && crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pw));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381; const s=salt+':'+pw; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'x'+h.toString(16);
}

    LS.set('session',u.id); loadSession(); return u;
  },
  async reset({email,password}){
    if(SB){ const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) throw new Error(error.message); return; }
    const users=LS.get('users',[]); const u=users.find(x=>x.email===email);
    if(!u) throw new Error('Email belum terdaftar.');
    u.salt=uid(); u.hash=await hashPw(password,u.salt); LS.set('users',users);
  },
  async changePassword({current,next}){
    if(SB){ const r=await SB.auth.signInWithPassword({email:U.email,password:current}); if(r.error) throw new Error('Kata sandi saat ini tidak cocok.'); const {error}=await SB.auth.updateUser({password:next}); if(error) throw new Error(error.message); return; }
    if(U.hash!==await hashPw(current,U.salt)) throw new Error('Kata sandi saat ini tidak cocok.');
    const users=LS.get('users',[]); const u=users.find(x=>x.id===U.id);
    u.salt=uid(); u.hash=await hashPw(next,u.salt); LS.set('users',users); loadSession();
  },
  async googleToken(){
    if(!SB) throw new Error('Supabase belum terhubung.');
    const redirectTo=location.origin+location.pathname;
    const {data,error}=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{prompt:'select_account'}}});
    if(error) throw new Error(error.message);
    if(data&&data.url) location.assign(data.url);
    return null;
  },
  logout(){ if(SB) SB.auth.signOut(); LS.del('session'); loadSession(); }
};

function bumpActivity(ok,drill){

  a.a++; if(ok) a.c++; if(drill&&ok) a.dc++;
}
function addStat(s,ok){ const r=DATA.sub[s]||(DATA.sub[s]={a:0,c:0}); r.a++; if(ok) r.c++; }
function streak(){
  let n=0; const d=new Date();
  if(!(DATA.activity[dkey(d)]&&DATA.activity[dkey(d)].a>0)) d.setDate(d.getDate()-1);
  while(DATA.activity[dkey(d)]&&DATA.activity[dkey(d)].a>0){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function weekDays(){
  const now=new Date(); const dow=(now.getDay()+6)%7; const names=['Sen','Sel','Rab','Kam','Jum','Sab','Min']; const out=[];
  for(let i=0;i<7;i++){ const d=new Date(now); d.setDate(now.getDate()-dow+i); const a=DATA.activity[dkey(d)]; out.push({n:names[i],on:!!(a&&a.a>0),today:i===dow}); }
  return out;
}

function hoursLeft(){ const e=new Date(); e.setHours(24,0,0,0); return Math.max(1,Math.ceil((e-Date.now())/36e5)); }
function totals(){ let a=0,c=0; Object.values(DATA.sub).forEach(r=>{a+=r.a;c+=r.c}); return {a,c}; }
function weakest(){
  const list=Object.entries(DATA.sub).filter(([,r])=>r.a>=3).map(([s,r])=>({s,acc:r.c/r.a,a:r.a})).sort((x,y)=>x.acc-y.acc);
  return list[0]||null;
}

  return !U.guest && DATA.packages.some(pid=>{ const p=PACKAGES.find(x=>x.id===pid); return p&&p.covers.includes(t.jalur); });
}
function inTryoutTimeline(t){
  if(!t.openAt || !t.closeAt) return true;
  const now=Date.now(), open=Date.parse(t.openAt), close=Date.parse(t.closeAt);
  return now>=open && now<=close;
}
function timelineLabel(t){
  if(!t.openAt || !t.closeAt) return 'Terbuka dengan paket';
  const f=new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short'});
  return `${f.format(new Date(t.openAt))}–${f.format(new Date(t.closeAt))}`;
}
function hasAccess(t){
  if(hasSubscriptionAccess(t)) return true;
  return t.access==='free' && inTryoutTimeline(t);
}
function accessReason(t){
  if(hasSubscriptionAccess(t)) return 'subscription';
  if(t.access==='free' && inTryoutTimeline(t)) return 'timeline';

let TF='all';
function activeProgram(){
  return ACTIVITY_OPTIONS.find(x=>x.id===activityList()[0])||null;

function tryoutMatchesTarget(t,target){
  if(!target) return true;
  if(t.target_id && String(t.target_id)===String(target.id)) return true;
  const n=String(target.name||'').toLowerCase().replace(/^ujian\s+/,'').replace(/\b20\d{2}\b/g,'');
  const title=String(t.title||'').toLowerCase();
  const aliases=n.split(/\s+/).filter(x=>x.length>2);
  if(target.jalur==='mandiri' && aliases.length && aliases.some(a=>title.includes(a))) return true;
  if(target.jalur==='utbk') return t.jalur==='utbk';
  if(target.jalur==='kedinasan') return t.jalur==='kedinasan';
  return t.jalur===target.jalur;
}
function lessonMatchesTarget(l,target){
  if(!target) return true;
  return l.j.includes(target.jalur);
}
function targetProgramLabel(){
  const t=activeProgram();
  return t ? t.name.replace(/^Ujian /,'') : JALUR[DATA.profile.jalur]?.name || 'Pilih target';
}

/* ===== QUESTION TYPES ===== */
function qType(q){ return String(q?.type||'single_choice'); }
function normalizeAnswer(v){ return String(v??'').trim().toLowerCase().replace(/\\s+/g,' '); }
function qCorrect(q,pick){
  const type=qType(q);
  if(type==='multiple_choice'){
    const wanted=String(q.correct_answer||'').toUpperCase().split(/[,;\\s]+/).filter(Boolean).sort();
    const got=Array.isArray(pick)?pick.map(x=>LETTERS[Number(x)]||String(x).toUpperCase()).sort():[];
    return wanted.length===got.length && wanted.every((x,i)=>x===got[i]);
  }
  if(type==='short_text') return normalizeAnswer(pick)===normalizeAnswer(q.correct_answer);
  if(type==='essay') return false;
  return Number(pick)===Number(q.a);
}
function questionInput(q,pick,disabled=false){
  const type=qType(q);
  if(type==='short_text') return `<input class="answerText" data-act="run-text" value="${esc(pick??'')}" ${disabled?'disabled':''} placeholder="Tulis jawaban singkat…">`;
  if(type==='essay') return `<textarea class="answerText" data-act="run-text" rows="7" ${disabled?'disabled':''} placeholder="Tulis jawabanmu…">${esc(pick??'')}</textarea>`;
  if(type==='multiple_choice') return `<div class="opts" role="group" aria-label="Pilih semua jawaban yang benar">${q.o.map((o,i)=>`<button class="opt ${Array.isArray(pick)&&pick.includes(i)?'sel':''}" ${disabled?'disabled':''} data-act="run-multi-pick" data-v="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  return `<div class="opts" role="radiogroup" aria-label="Pilihan jawaban">${q.o.map((o,i)=>`<button class="opt ${pick===i?'sel':''}" ${disabled?'disabled':''} data-act="run-pick" data-v="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
}

/* ===== TRYOUT RUNNER ===== */
function startTryout(tid){
  const t=TRYOUTS.find(x=>x.id===tid);
  if(!t) return go('/tryout');
  if(!hasAccess(t)) return go('/paket');
  if(!tryoutQids(t).length) return toast('Soal tryout belum tersedia.');
  if(DATA.inprogress && DATA.inprogress.tid===tid){ return go('/tryout/'+tid+'/kerjakan'); }
  if(DATA.inprogress){ return openModal(`<h3>Ada tryout yang belum selesai</h3><p class="muted">Selesaikan atau lepas dulu tryout sebelumnya sebelum memulai yang baru. Jawaban tryout yang dilepas tidak dinilai.</p><div class="row mt16"><button class="btn btn-ghost grow" data-act="close">Batal</button><button class="btn btn-ink grow" data-act="drop-start" data-v="${tid}">Lepas dan mulai baru</button></div>`); }
  if(t.access==='free' && triesUsed(t)>=t.tries) return toast('Percobaan untuk tryout ini sudah habis.');
  const now=Date.now();
  DATA.inprogress={id:uid(), tid, startedAt:now, endsAt:now+tryoutMinutes(t)*60000, qids:tryoutQids(t), answers:{}, flags:{}, cur:0};
  save(); go('/tryout/'+tid+'/kerjakan');
}
function fmtClock(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }

function viewRun(tid){
  const A=DATA.inprogress;
  if(!A||A.tid!==tid) return go('/tryout/'+tid);
  if(Date.now()>=A.endsAt) return submitAttempt(true);
  renderRun();
  timers.push(setInterval(()=>{
    const left=A.endsAt-Date.now(), el=$('#timer');
    if(left<=0){ clearTimers(); toast('Waktu habis. Jawabanmu dikumpulkan otomatis.'); return submitAttempt(true); }
    if(el){ el.textContent=fmtClock(left); el.classList.toggle('low',left<5*60000); }
  },1000));
}
function renderRun(){
  const A=DATA.inprogress, t=TRYOUTS.find(x=>x.id===A.tid), q=QBY[A.qids[A.cur]];
  const pick=A.answers[q.id], total=A.qids.length;
  // group navigator by subtest
  const groups=[]; A.qids.forEach((id,i)=>{ const s=QBY[id].s; let g=groups[groups.length-1]; if(!g||g.s!==s){ g={s,items:[]}; groups.push(g);} g.items.push(i); });
  const nav=groups.map(g=>`<div class="mt16"><div class="small" style="font-weight:700;margin-bottom:8px">${SUB[g.s].n}</div><div class="navgrid">${g.items.map(i=>{const id=A.qids[i];return `<button class="nb ${A.answers[id]!=null?'ans':''} ${A.flags[id]?'flag':''} ${i===A.cur?'cur':''}" data-act="run-go" data-v="${i}" aria-label="Soal ${i+1}${A.answers[id]!=null?', sudah dijawab':''}${A.flags[id]?', ditandai':''}">${i+1}</button>`}).join('')}</div></div>`).join('');

  mount(`<div class="runTop"><div class="wrap runTopIn"><span class="brandMark">C</span><div class="grow" style="min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</b></div>

        ${q.p?`<div class="passage">${esc(q.p)}</div>`:''}

        ${q.image_url?`<img src="${esc(q.image_url)}" alt="Ilustrasi soal" style="max-width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin:12px 0">`:''}
        ${questionInput(q,pick,false)}
        <div class="row mt16"><button class="btn btn-ghost btn-sm" data-act="run-flag">${ic('flag')}${A.flags[q.id]?'Hapus tanda ragu':'Tandai ragu-ragu'}</button>${pick!=null?`<button class="btn btn-ghost btn-sm" data-act="run-clear">Hapus jawaban</button>`:''}</div>
      </section>

        <div class="legend"><span><i style="background:#191b20;border-color:#191b20"></i>Dijawab</span><span><i></i>Belum</span><span><i style="background:#f4c62f;border-color:#191b20"></i>Ragu</span></div></aside>
    </div>
    <div class="runFoot"><div class="wrap runFootIn"><button class="btn btn-ghost" data-act="run-prev" ${A.cur===0?'disabled':''}>Sebelumnya</button>

function submitAttempt(auto){
  const A=DATA.inprogress; if(!A) return go('/tryout');
  clearTimers(); closeModal();
  const t=TRYOUTS.find(x=>x.id===A.tid), per={};
  A.qids.forEach(id=>{
    const q=QBY[id], pick=A.answers[id], r=per[q.s]||(per[q.s]={pts:0,max:0,n:0,correct:0,wrong:0,empty:0});
    r.n++; r.max+=q.pts?5:1;
    if(pick==null){ r.empty++; }
    else{ const ok=qCorrect(q,pick); const earned=q.pts&&Number.isInteger(pick)?(q.pts[pick]||0):(ok?1:0); r.pts+=earned; if(qType(q)!=='essay' && ok) r.correct++; else if(qType(q)!=='essay') r.wrong++; if(qType(q)==='essay') r.empty++; addStat(q.s,ok); bumpActivity(ok,false); }
  });
  Object.values(per).forEach(r=>r.score=Math.round(200+800*r.pts/r.max));
  const scores=Object.values(per).map(r=>r.score), total=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const att={id:uid(), tid:A.tid, at:Date.now(), total, subs:per, qids:A.qids, answers:A.answers, flags:A.flags, durSec:Math.round((Math.min(Date.now(),A.endsAt)-A.startedAt)/1000)};
  DATA.attempts.push(att); DATA.xp+=50; DATA.inprogress=null; save();
  go('/hasil/'+att.id);
}

  if(p.error) console.warn('posts',p.error); else { CACHE_POSTS=p.data.map(mapPost); await hydrateReplyUsers(CACHE_POSTS); }

    const live=new Map(t.data.map(x=>[x.id,topicMeta(x)]));

async function processCogitImage(file){
  if(!/^image\/(jpeg|png|webp|gif|avif)$/i.test(file.type)) return toast('Pilih file gambar yang didukung.');
  if(file.size>12*1024*1024) return toast('Ukuran gambar maksimal 12 MB.');
  try{
    const src=await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
    const img=await new Promise((resolve,reject)=>{ const i=new Image(); i.onload=()=>resolve(i); i.onerror=reject; i.src=src; });
    const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*scale)); c.height=Math.max(1,Math.round(img.naturalHeight*scale));

async function processReplyImage(file){
  if(!/^image\/(jpeg|png|webp|gif|avif)$/i.test(file.type)) return toast('Pilih file gambar yang didukung.');
  if(file.size>12*1024*1024) return toast('Ukuran gambar maksimal 12 MB.');
  try{
    const src=await new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
    const img=await new Promise((resolve,reject)=>{ const i=new Image(); i.onload=()=>resolve(i); i.onerror=reject; i.src=src; });
    const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*scale)); c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    REPLY_IMAGE_BLOB=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.84)); if(!REPLY_IMAGE_BLOB) throw new Error('Gambar tidak bisa diproses.');
    REPLY_IMAGE_PREVIEW=c.toDataURL('image/jpeg',.84);
    cgRefresh();
  }catch(err){ console.warn('reply image',err); toast('Gambar belum bisa dibuka. Coba file lain.'); }
}

function cgFitTopicAction(){

  let available=bar.clientWidth;

  const fits=()=>chips.reduce((sum,c)=>sum+c.getBoundingClientRect().width,0)+action.getBoundingClientRect().width+gap*(chips.length)>=available;

    if(needed<=available) break;

function replyCount(p){ return Array.isArray(p.replies)?p.replies.length:0; }

function replyTreeHtml(p){
  const rows=Array.isArray(p.replies)?p.replies:[], index=new Map(), children=new Map();
  rows.forEach((r,i)=>{
    const id=String(r.id||('legacy-'+p.id+'-'+i));
    index.set(id,{...r,id});
  });
  rows.forEach((r,i)=>{
    const id=String(r.id||('legacy-'+p.id+'-'+i));
    const parent=String(r.parent_id||r.parentId||'');
    if(!children.has(parent)) children.set(parent,[]);
    children.get(parent).push(index.get(id));
  });

  const countDesc=(id,seen=new Set())=>{
    const key=String(id);
    if(seen.has(key)) return 0;
    seen.add(key);
    let n=0;
    (children.get(key)||[]).forEach(r=>{ n++; n+=countDesc(r.id,seen); });
    return n;
  };

  /*
   * IMPORTANT VISUAL RULE:
   * - depth 1 = comment utama, no indent.
   * - depth 2+ = SATU shared visual reply level.
   *
   * The data can still be arbitrarily deep. We deliberately flatten the
   * rendered DOM into ONE reply column so a reply-to-reply never creates
   * a third visual indentation level.
   */
  const replyContent=(r,visualDepth=1)=>{
    const t=Number(r.t)||new Date(r.created_at||Date.now()).getTime();
    const likes=Array.isArray(r.likes)?r.likes.map(String):[];
    const liked=!U.guest&&likes.includes(String(U.id));
    const src=r.avatar||(r.uid===U.id&&(DATA.profile.avatar||DATA.profile.gpic))||'';
    const username=replyUsername(r);
    const usernameHtml=r.uid&&username
      ?`<a class="cgReplyUsername" href="#/profil/${esc(r.uid)}">${esc(username)}</a>`
      :`<span class="cgReplyUsername">${esc(username||'pengguna')}</span>`;
    const replyToHandle=r.reply_to_username||r.replyToUsername||'';
    const replyTo=replyToHandle?mentionHtml(replyToHandle):'';
    const image=r.image_url||r.imageUrl||'';
    const replyForm=REPLY_TO===r.id&&!U.guest?`<form class="cgReplyInline" data-form="reply" data-id="${esc(p.id)}" data-parent="${esc(r.id)}">${avLink(U.id,DATA.profile.avatar||DATA.profile.gpic||'',DATA.profile.name)}<input class="input cgMentionInput" name="text" maxlength="200" placeholder="Balas ke ${esc(username||'pengguna')}" aria-label="Balas ke ${esc(username||'pengguna')}" autocomplete="off"><div class="cgMentionMenu" hidden></div><input type="file" data-reply-image-input="1" accept="image/*" hidden><button class="pbtn" type="button" data-act="reply-image-pick" aria-label="Tambah foto balasan">${cgIc('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>')}</button><button class="btn btn-yellow btn-sm" type="submit">Balas</button></form>${REPLY_IMAGE_PREVIEW?`<div class="cgReplyPreview"><img src="${esc(REPLY_IMAGE_PREVIEW)}" alt="Pratinjau foto balasan"><button type="button" data-act="reply-image-remove" aria-label="Hapus foto balasan">×</button></div>`:''}`:'';

    return `<div class="cgRep cgRepDepth cgVisualDepth${visualDepth===1?'Root':'Reply'}" data-reply-id="${esc(r.id)}" data-depth="${visualDepth}" style="--cg-depth:${visualDepth-1}">${avLink(r.uid,src,username||'pengguna')}<div class="cgRepBody"><div class="cgRepMeta"><div class="cgRepIdentity">${usernameHtml}<span class="muted small">· ${timeAgo(t)}</span></div><button class="pbtn cgMore" data-act="reply-menu" data-id="${esc(p.id)}" data-reply="${esc(r.id)}" aria-label="Opsi balasan">${cgIc('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',1)}</button></div><p class="cgText cgRepText">${replyTo?`<span class="cgReplyTo">${replyTo}</span> `:''}${mentionHtml(r.text||'')}</p>${image?`<img class="cgReplyImage" src="${esc(image)}" alt="Foto dalam balasan" loading="lazy">`:''}<div class="cgRepActions"><button class="pbtn ${liked?'pl':''}" data-act="reply-like" data-id="${esc(p.id)}" data-reply="${esc(r.id)}" aria-pressed="${liked}" aria-label="Sukai balasan">${cgIc('<path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z"/>',liked)}<span>${likes.length}</span></button><button class="pbtn cgReplyAction" data-act="reply-open" data-id="${esc(p.id)}" data-reply="${esc(r.id)}" aria-label="Balas komentar">${cgIc('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>')}<span>Balas</span></button></div>${replyForm}</div></div>`;
  };

  /* Flatten every visible descendant into the root reply container.
     This is the critical fix: no descendant is rendered inside the
     previous reply's .cgRepBody, so CSS nesting can never create level 3. */
  const flatVisible=(roots)=>{
    const renderThread=(root)=>{
      const out=[];
      const walk=(r,depth)=>{
        out.push(replyContent(r,depth===1?1:2));
        if(REPLY_EXPANDED.has(String(r.id))){
          (children.get(String(r.id))||[]).forEach(child=>walk(child,depth+1));
        }
      };
      walk(root,1);
      const total=countDesc(root.id);
      if(total){
        const allIds=[];
        const collect=(rid)=>{
          const key=String(rid);
          if(allIds.includes(key)) return;
          allIds.push(key);
          (children.get(key)||[]).forEach(ch=>collect(ch.id));
        };
        collect(root.id);
        const expanded=allIds.length>1 && allIds.every(rid=>REPLY_EXPANDED.has(rid));
        out.push(`<button class="cgRepliesToggle cgThreadToggle" data-act="reply-toggle" data-id="${esc(p.id)}" data-reply="${esc(root.id)}" aria-expanded="${expanded}">${expanded?'Sembunyikan balasan':'Lihat semua '+total+' balasan'}</button>`);
      }
      return out.join('');
    };
    return roots.map(renderThread).join('');
  };

  const roots=children.get('')||[];
  return roots.length?`<div class="cgFlatReplyThread">${flatVisible(roots)}</div>`:'';

function statsFrom(d){

  return {best:att.length?Math.max(...att.map(x=>+x.total||0)):0,tryouts:att.length,answered:a,acc:a?pct(c,a):0,
    attempts:att.slice(-12).map(x=>({total:+x.total||0,at:+x.at||0})),sub:Object.fromEntries(Object.entries(sub).map(([k,r])=>[k,{a:r.a||0,c:r.c||0}]))};
}

/* ===== NERA AI ===== */
function neraWeakSubs(){
  const pool=Object.keys(SUB).filter(k=>SUB[k].j===DATA.profile.jalur);
  const scored=pool.map(k=>{const r=DATA.sub[k];return {k,acc:r&&r.a?r.c/r.a:-1,a:r?r.a:0}});
  return scored.sort((x,y)=>(x.acc<0?0.5:x.acc)-(y.acc<0?0.5:y.acc)).map(x=>x.k);
}
function neraExplain(q){
  const body=q.p?`Bacaan: <i>${esc(q.p.slice(0,120))}…</i><br>`:'';
  return `<p>Kita bahas bertahap ya.</p><ol><li><b>Pahami soal.</b> ${body}${esc(q.q.length>170?q.q.slice(0,170)+'…':q.q)}</li><li><b>Pilih strategi.</b> ${esc(TIPS[q.s]||'')}</li><li><b>Pembahasan.</b> ${esc(q.e)}</li></ol><p>Jawaban yang tepat: <b>${LETTERS[q.a]}. ${esc(q.o[q.a])}</b></p><p><a class="link" href="#/latihan/${q.s}">Latih soal serupa di ${SUB[q.s].n}</a></p>`;
}
function neraPlan(){
  const w=neraWeakSubs().slice(0,3), goal=DATA.profile.goal;
  const d=[`Hari 1: baca materi ${SUB[w[0]].n} dan tandai selesai.`,`Hari 2: latihan ${SUB[w[0]].n} (target ${goal} jawaban benar).`,`Hari 3: baca materi ${SUB[w[1]||w[0]].n}.`,`Hari 4: latihan ${SUB[w[1]||w[0]].n}, lalu ulang soal yang salah.`,`Hari 5: latihan ${SUB[w[2]||w[0]].n} dan cek Laporan belajar.`,`Hari 6: istirahat ringan, cukup 1 sesi latihan.`,`Hari 7: kerjakan satu tryout lalu baca pembahasannya.`];
  return `<p>Ini rencana 7 hari berdasarkan jalur <b>${JALUR[DATA.profile.jalur].name}</b> dan subtes yang paling perlu diperkuat:</p><ol>${d.map(x=>`<li>${esc(x.replace(/^Hari \d: /,'').replace(/^./,c=>c.toUpperCase()))}</li>`).join('')}</ol><p class="muted small">Sesuaikan dengan waktumu. Konsisten lebih penting daripada jumlah soal.</p>`;
}
function neraAnalysis(){
  const rows=Object.entries(DATA.sub).filter(([,r])=>r.a>0).map(([s,r])=>({s,acc:pct(r.c,r.a),a:r.a})).sort((x,y)=>x.acc-y.acc);
  if(!rows.length) return `<p>Kamu belum punya data jawaban. Kerjakan <a class="link" href="#/tryout">tryout gratis</a> atau <a class="link" href="#/latihan">latihan soal</a> dulu, lalu aku bisa bantu membaca hasilnya.</p>`;
  return `<p>Ringkasan akurasimu:</p><ul>${rows.map(r=>`<li>${esc(SUB[r.s].n)}: <b>${r.acc}%</b> (${r.a} soal)</li>`).join('')}</ul><p>Prioritas: <b>${esc(SUB[rows[0].s].n)}</b>. ${esc(TIPS[rows[0].s]||'')} <a class="link" href="#/latihan/${rows[0].s}">Latihan sekarang</a></p>`;
}
function neraLocal(msg,qid){
  const m=msg.toLowerCase();
  if(qid&&QBY[qid]) return neraExplain(QBY[qid]);
  if(/rencana|jadwal belajar|plan/.test(m)) return neraPlan();
  if(/progres|lemah|kelemahan|analisis|laporan|hasil saya|prioritas/.test(m)) return neraAnalysis();
  const subHit=Object.entries(SUB).find(([k,v])=>m.includes(v.n.toLowerCase())||new RegExp('\\b'+k+'\\b').test(m)||m.includes('('+k+')'));
  let best=null,bs=0;
  LESSONS.forEach(l=>{ let s=0; l.kw.forEach(k=>{ if(m.includes(k)) s+=2; }); l.t.toLowerCase().split(/\W+/).forEach(w=>{ if(w.length>4&&m.includes(w)) s++; }); if(subHit&&l.s===subHit[0]) s+=1; if(s>bs){bs=s;best=l;} });
  if(best&&bs>=2){
    const first=best.body.replace(/<h3>.*?<\/h3>/gs,'').replace(/<span class="eq">(.*?)<\/span>/gs,'<li>$1</li>');
    return `<p>Ini ringkasan dari materi <b>${esc(best.t)}</b>:</p>${/<li>/.test(first)?'':''}<div>${first.slice(0,700)}</div><p><a class="link" href="#/materi/${best.id}">Buka materi lengkap</a> · <a class="link" href="#/latihan/${best.s}">Latihan soal</a></p>`;
  }
  if(subHit) return `<p><b>${esc(SUB[subHit[0]].n)}.</b> ${esc(TIPS[subHit[0]]||'')}</p><p><a class="link" href="#/latihan/${subHit[0]}">Mulai latihan</a></p>`;
  return `<p>Aku belum menemukan jawaban pasti untuk itu. Coba tanya dengan salah satu cara ini:</p><ul><li>"Jelaskan silogisme"</li><li>"Tips mengerjakan TKP"</li><li>"Buat rencana belajar 7 hari"</li><li>"Analisis kelemahanku"</li></ul><p>Untuk membahas satu soal, buka pembahasannya lalu tekan <b>Tanya Nera</b>.</p>`;
}

    el.textContent=s>0?(h?h+':':'')+mm+':'+ss:'Waktu habis'; el.classList.toggle('late',s===0);
    if(s===0&&!fired){ fired=true; payRefresh(o); } };
  tick(); timers.push(setInterval(tick,1000));
}

let PAYCH=null;
function payUnwatch(){ if(PAYCH&&SB){ try{ SB.removeChannel(PAYCH); }catch(_){} } PAYCH=null; }
async function payApply(o,row){
  if(!row||row.id!==o.id||row.status===o.status) return;
  Object.assign(o,row);
  const i=MYORD.findIndex(x=>x.id===o.id); if(i>=0) MYORD[i]=o;
  if(o.status==='paid'){ await refreshPay(); toast('Pembayaran diterima. Paket aktif!'); }
  if(location.hash.indexOf(o.id)>=0) renderBayar(o);
}
async function payRefresh(o){
  try{ const r=await SB.functions.invoke('check-payment',{body:{order_id:o.id}});
    if(r.data&&r.data.order){ if(r.data.order.status===o.status&&o.status==='pending'&&payExpired(o)){ o.status='expired'; renderBayar(o); } else await payApply(o,r.data.order); } }catch(_){}
}
function payWatch(o){
  payUnwatch();
  try{ PAYCH=SB.channel('order-'+o.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:'id=eq.'+o.id},pl=>payApply(o,pl.new)).subscribe(); }catch(_){}
  let n=0;
  timers.push(setInterval(async()=>{
    if(document.hidden&&n%3) { n++; return; }
    n++;
    if(n%5===0) return payRefresh(o);                 // ~20 dtk: tanya Midtrans langsung (cadangan webhook)
    const r=await SB.from('orders').select('*').eq('id',o.id).maybeSingle(); if(r.data) payApply(o,r.data);
  },4000));
}
function renderBayar(o){
  clearTimers();
  const p=PACKAGES.find(x=>x.id===o.package_id)||{name:o.package_id,price:o.amount,id:o.package_id};
  const m=PAYM.find(x=>x.id===o.method)||{n:o.method}, exp=payExpired(o), live=o.status==='pending'&&!exp;
  const step=o.status==='paid'?4:2;
  let main;
  if(o.status==='paid') main=`<section class="card ckCard"><div class="ckBody ckDone"><span class="ckBig ok">${ic('check')}</span><h2>Pembayaran diterima</h2><p class="muted">Order ${ordNo(o)} lunas. Paket ${esc(p.name)} sudah aktif selama ${o.months||12} bulan. Selamat belajar!</p><div class="row mt16 wrapflex" style="justify-content:center"><a class="btn btn-yellow" href="#/tryout">Mulai tryout</a><a class="btn btn-ghost" href="#/paket">Lihat paket belajar</a></div></div></section>`;
  else if(exp) main=`<section class="card ckCard"><div class="ckBody ckDone"><span class="ckBig bad">!</span><h2>${o.status==='failed'?'Pembayaran gagal':'Waktu pembayaran habis'}</h2><p class="muted">Order ${ordNo(o)} tidak bisa dibayar lagi. Sudah terlanjur bayar? Tunggu beberapa menit lalu tekan Cek status, atau hubungi admin dengan menyebut Order ID.</p><div class="row mt16 wrapflex" style="justify-content:center"><a class="btn btn-yellow" href="#/checkout/${esc(o.package_id)}">Buat pesanan baru</a><button type="button" class="btn btn-ghost" data-act="pay-check" data-id="${o.id}">Cek status</button><a class="btn btn-ghost" href="bantuan.html">Hubungi admin</a></div></div></section>`;
  else main=(o.pay_type||(m.g==='bank'?'va':'qris'))==='va'?vaCard(o,m):qrisCard(o,m);
  mount(shell('paket',`<a class="ckBack" href="#/paket">${I_BACK}Kembali ke paket</a>${ckSteps(step)}<div class="ckGrid"><div class="ckMain">${main}</div><aside class="ckSide">${paySummary(o,p)}</aside></div>`));
  if(live){ startTimer(o); payWatch(o); }
}

let AVE=null;
function avDraw(ctx,size,k,mask){
  const a=AVE, w=a.img.width, h=a.img.height, base=Math.max(a.S/w,a.S/h)*a.zoom, iw=w*base, ih=h*base;
  const mx=Math.max(0,(iw-a.S)/2), my=Math.max(0,(ih-a.S)/2);
  a.ox=Math.min(mx,Math.max(-mx,a.ox)); a.oy=Math.min(my,Math.max(-my,a.oy));
  ctx.clearRect(0,0,size,size); ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
  ctx.drawImage(a.img,((a.S-iw)/2+a.ox)*k,((a.S-ih)/2+a.oy)*k,iw*k,ih*k);
  if(mask){ ctx.save(); ctx.fillStyle='rgba(25,27,32,.55)'; ctx.beginPath(); ctx.rect(0,0,size,size); ctx.arc(size/2,size/2,size/2-3,0,Math.PI*2,true); ctx.fill('evenodd'); ctx.restore();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(size/2,size/2,size/2-3,0,Math.PI*2); ctx.stroke(); }
}
function avEditor(file){
  if(!file) return;
  if(!/^image\//.test(file.type)) return toast('Pilih file gambar (JPG, PNG, atau WebP).');
  if(file.size>12e6) return toast('Ukuran foto maksimal 12 MB.');
  const img=new Image(), url=URL.createObjectURL(file);
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('Foto tidak bisa dibaca. Coba file lain.'); };
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const S=Math.min(280,window.innerWidth-90);
    AVE={img,S,zoom:1,ox:0,oy:0};
    openModal(`<h3>Atur foto</h3><p class="muted small" style="margin:4px 0 0">Geser untuk memosisikan, atur zoom dengan slider.</p>
      <canvas id="avCv" class="avCv" width="${S}" height="${S}" aria-label="Pratinjau foto profil"></canvas>
      <input type="range" class="avZoom" id="avZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom">
      <div class="row mt16"><button class="btn btn-ghost grow" data-act="close">Batal</button><button class="btn btn-yellow grow" data-act="av-save">Simpan foto</button></div>`);
    const cv=$('#avCv'), ctx=cv.getContext('2d'), draw=()=>avDraw(ctx,S,1,true); draw();
    let drag=null;
    cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,ox:AVE.ox,oy:AVE.oy}; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove',e=>{ if(!drag) return; AVE.ox=drag.ox+(e.clientX-drag.x); AVE.oy=drag.oy+(e.clientY-drag.y); draw(); });
    const end=()=>{ drag=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
    $('#avZoom').addEventListener('input',e=>{ AVE.zoom=+e.target.value; draw(); });
  };
  img.src=url;
}
document.addEventListener('change',e=>{ if(e.target&&e.target.id==='avFile'){ const f=e.target.files[0]; closeModal(); avEditor(f); } });

  'reply-toggle'(t){
    const id=String(t.dataset.reply||''), y=window.scrollY;
    _cgReplyScrollY=y;
    // Prevent the background post refresh from firing during this local UI toggle.
    _pl=Date.now();
    const ps=getPosts(), p=ps.find(x=>String(x.id)===String(t.dataset.id));
    if(!p){ return; }
    const rows=Array.isArray(p.replies)?p.replies:[];
    const byId=new Map();
    rows.forEach((r,i)=>byId.set(String(r.id||('legacy-'+p.id+'-'+i)),r));
    const parentOf=r=>String(r?.parent_id||r?.parentId||'');
    const rootIdOf=(start)=>{
      let cur=String(start), guard=0;
      while(cur && guard++<rows.length+2){
        const r=byId.get(cur); if(!r) break;
        const par=parentOf(r);
        if(!par || !byId.has(par)) break;
        cur=par;
      }
      return cur;
    };
    const rootId=rootIdOf(id);
    const threadIds=[];
    const collect=(rid)=>{
      const key=String(rid);
      if(!key || threadIds.includes(key)) return;
      threadIds.push(key);
      rows.forEach((r,i)=>{
        const cid=String(r.id||('legacy-'+p.id+'-'+i));
        if(parentOf(r)===key) collect(cid);
      });
    };
    collect(rootId||id);
    const allOpen=threadIds.length>0 && threadIds.every(rid=>REPLY_EXPANDED.has(rid));
    if(allOpen){
      threadIds.forEach(rid=>REPLY_EXPANDED.delete(rid));
    }else{
      threadIds.forEach(rid=>REPLY_EXPANDED.add(rid));
    }
    cgRefresh();
  },

/* ===== COMMENT MENTIONS ===== */
function mentionCandidates(input){
  const value=String(input.value||'');
  const caret=input.selectionStart??value.length;
  const before=value.slice(0,caret);
  const m=before.match(/(?:^|\s)@([a-zA-Z0-9._-]*)$/);
  if(!m) return {q:'',start:-1};
  return {q:(m[1]||'').toLowerCase(),start:caret-(m[1]||'').length-1};
}
function closeMentionMenus(){ document.querySelectorAll('.cgMentionMenu:not([hidden])').forEach(x=>x.hidden=true); }
document.addEventListener('input',e=>{
  const input=e.target.closest('.cgMentionInput'); if(!input) return;
  const menu=input.parentElement?.querySelector('.cgMentionMenu'); if(!menu) return;
  const info=mentionCandidates(input); if(info.start<0){ menu.hidden=true; return; }
  const list=localPeople().filter(u=>normalizeUsername(u.username||u.name).startsWith(info.q)).filter(u=>u.uid!==U.id);
  if(!list.length){ menu.hidden=true; return; }
  menu.innerHTML=mentionPickerHtml(list); menu.hidden=false;
});
document.addEventListener('click',e=>{
  const pick=e.target.closest('.cgMentionPick');
  if(pick){
    const menu=pick.closest('.cgMentionMenu'), form=pick.closest('form'), input=form?.querySelector('.cgMentionInput'); if(!input) return;
    const value=input.value, caret=input.selectionStart??value.length, before=value.slice(0,caret), m=before.match(/(?:^|\s)@([a-zA-Z0-9._-]*)$/); if(!m) return;
    const start=caret-(m[1]||'').length-1, handle='@'+pick.dataset.mention;
    input.value=value.slice(0,start)+handle+' '+value.slice(caret); const pos=start+handle.length+1; input.focus(); input.setSelectionRange(pos,pos); if(menu) menu.hidden=true; return;
  }
  if(!e.target.closest('.cgMentionMenu,.cgMentionInput')) closeMentionMenus();
});

document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const v=Object.fromEntries(new FormData(f).entries()); const kind=f.dataset.form, btn=f.querySelector('button[type=submit]');
  const busy=b=>{ if(btn){ btn.disabled=b; } };
  try{
    if(kind==='register'){
      const name=(v.name||'').trim(), username=normalizeUsername(v.username), phone=(v.phone||'').trim(), sekolah=(v.sekolah||'').trim(), kelas=(v.kelas||'').trim(), email=(v.email||'').trim().toLowerCase(), pw=v.password||'';
      if(name.length<2) return authErr('Nama minimal 2 karakter.');
      if(!/^[a-z0-9._-]{3,20}$/.test(username)) return authErr('Username 3–20 karakter: huruf kecil, angka, titik, _ atau -.');
      if(!/^08\d{8,12}$|^\+628\d{7,11}$/.test(phone)) return authErr('No. HP harus diawali 08 atau +62. Contoh: 081234567890.');
      if(sekolah.length<2) return authErr('Asal sekolah wajib diisi.');
      if(kelas.length<1) return authErr('Kelas wajib diisi.');
      if(!validEmail(email)) return authErr('Format email belum benar. Contoh: nama@email.com');
      if(pw.length<8) return authErr('Kata sandi minimal 8 karakter.');
      if(!v.agree) return authErr('Centang persetujuan Syarat & Ketentuan untuk melanjutkan.');
      const taken=LS.get('users',[]).some(u=>normalizeUsername(u.username)===username);
      if(taken) return authErr('Username tersebut sudah digunakan. Pilih username lain.');
      authErr(''); busy(true);
      const r=await Auth.register({name,username,phone,sekolah,kelas,email,password:pw}); LS.set('flash',{email,migrated:r.migrated}); go('/masuk');
    } else if(kind==='login'){
      const email=(v.email||'').trim().toLowerCase();
      if(!validEmail(email)) return authErr('Format email belum benar. Contoh: nama@email.com');
      if(!v.password) return authErr('Masukkan kata sandi kamu.');
      authErr(''); busy(true);
      await Auth.login({email,password:v.password});
      if(v.remember){ LS.del('volatile'); } else { LS.set('volatile',true); try{ sessionStorage.setItem('cognera:alive','1'); }catch(e){} }
      go('/beranda');
    } else if(kind==='reset'){
      const msg=$('#resetMsg'); busy(true);
      try{ await Auth.reset({email:(v.email||'').trim().toLowerCase(),password:v.password}); msg.innerHTML='<div class="ok-note">Kata sandi diperbarui. Silakan masuk.</div>'; setTimeout(closeModal,1200); }
      catch(err){ msg.innerHTML=`<div class="err">${esc(err.message)}</div>`; busy(false); }
    } else if(kind==='profile'){
      if(U.guest){ Object.assign(DATA.profile,{jalur:v.jalur,tahun:+v.tahun,goal:+v.goal}); }
      else {
        const name=(v.name||'').trim(), username=normalizeUsername(v.username), phone=(v.phone||'').trim(), sekolah=(v.sekolah||'').trim(), kelas=(v.kelas||'').trim(); if(name.length<2) return toast('Nama minimal 2 karakter.');
        if(!/^[a-z0-9._-]{3,20}$/.test(username)) return toast('Username 3–20 karakter: huruf kecil, angka, titik, _ atau -.');
        if(!/^08\d{8,12}$|^\+628\d{7,11}$/.test(phone)) return toast('No. HP harus diawali 08 atau +62.');
        if(sekolah.length<2) return toast('Asal sekolah wajib diisi.');
        if(kelas.length<1) return toast('Kelas wajib diisi.');
        const users=LS.get('users',[]); if(users.some(x=>x.id!==U.id&&normalizeUsername(x.username)===username)) return toast('Username tersebut sudah digunakan.');
        Object.assign(DATA.profile,{name,username,phone,sekolah,kelas,jalur:v.jalur,tahun:+v.tahun,goal:+v.goal});
        const u=users.find(x=>x.id===U.id); if(u){u.name=name;u.username=username;u.phone=phone;u.sekolah=sekolah;u.kelas=kelas; LS.set('users',users);}
      }
      save(); $('#profOk').innerHTML='<div class="ok-note">Perubahan tersimpan.</div>'; toast('Perubahan tersimpan');
    } else if(kind==='password'){
      const m=$('#pwMsg'); busy(true);
      try{ await Auth.changePassword({current:v.current,next:v.next}); m.innerHTML='<div class="ok-note">Kata sandi berhasil diubah.</div>'; f.reset(); }
      catch(err){ m.innerHTML=`<div class="err">${esc(err.message)}</div>`; }
      busy(false);
    } else if(kind==='post'){
      if(needLogin('Masuk untuk membagikan Cogit.')) return;
      const text=(v.text||'').trim(); if(!text&&!CG_IMAGE_BLOB) return toast('Tulis Cogit atau tambahkan gambar dulu.');
      if(!isFol(v.topic||'umum')) return toast('Ikuti topik ini dulu untuk membagikan Cogit.');
      let imageUrl='';
      if(CG_IMAGE_BLOB){
        if(SB){ const path=`${U.id}/${uid()}.jpg`, up=await SB.storage.from('community-media').upload(path,CG_IMAGE_BLOB,{upsert:false,contentType:'image/jpeg',cacheControl:'3600'});
          if(up.error){ console.warn('Cogit image upload',up.error); return toast('Gagal mengunggah gambar. Pastikan migrasi Cogit sudah diterapkan.'); }
          imageUrl=SB.storage.from('community-media').getPublicUrl(path).data.publicUrl;
        }else imageUrl=CG_IMAGE_PREVIEW;
      }
      if(SB){ const av=DATA.profile.avatar||DATA.profile.gpic||''; const {data,error}=await SB.from('community_posts').insert({uid:U.id,author:DATA.profile.name,username:DATA.profile.username||null,topic:v.topic||'umum',text:text.slice(0,280),image_url:imageUrl||null,avatar:/^https?:/.test(av)?av:null}).select().single();
        if(error){ console.warn(error); return toast('Gagal mengirim: '+(error.message||'coba lagi')); }
        CACHE_POSTS.unshift(mapPost({...data,image_url:imageUrl||data.image_url})); clearCogitImage(); viewKomunitas(); return toast('Cogit terkirim'); }
      const ps=getPosts(); ps.push({id:uid(),uid:U.id,author:DATA.profile.name,username:DATA.profile.username||'',avatar:DATA.profile.avatar||DATA.profile.gpic||'',topic:v.topic||'umum',text:text.slice(0,280),image_url:imageUrl,t:Date.now(),likes:[],replies:[]}); LS.set('posts',ps); clearCogitImage(); viewKomunitas(); toast('Cogit terkirim');
    } else if(kind==='reply'){
      if(needLogin('Masuk untuk membalas Cogit.')) return;
      const text=(v.text||'').trim(); if(!text&&!REPLY_IMAGE_BLOB) return toast('Tulis balasan atau tambahkan foto dulu.');
      const ps=getPosts(), p=ps.find(x=>String(x.id)===String(f.dataset.id)); if(!p) return;
      let imageUrl='';
      try{ imageUrl=await uploadReplyImage(); }catch(err){ console.warn('reply image upload',err); return toast('Gagal mengunggah foto balasan.'); }
      const av=DATA.profile.avatar||DATA.profile.gpic||'', parentReply=f.dataset.parent?replyRecord(p.id,f.dataset.parent):null, reply={id:uid(),parent_id:f.dataset.parent||null,reply_to_username:parentReply?(parentReply.username||parentReply.reply_to_username||parentReply.replyToUsername||handleOf(parentReply.author)):handleOf(p.username||p.author),username:DATA.profile.username||'',author:DATA.profile.name,avatar:av,uid:U.id,text:text.slice(0,200),image_url:imageUrl,t:Date.now(),likes:[]};
      if(!Array.isArray(p.replies)) p.replies=[]; p.replies.push(reply); REPLY_TO=null; REPLY_IMAGE_BLOB=null; REPLY_IMAGE_PREVIEW='';
      if(SB){ const {data,error}=await SB.rpc('add_cogit_reply',{p_post_id:p.id,p_body:text.slice(0,200),p_parent_id:reply.parent_id,p_image_url:imageUrl||null});
        if(error){ p.replies=p.replies.filter(x=>x.id!==reply.id); viewKomunitas(); console.warn(error); return toast('Gagal mengirim balasan. Pastikan migrasi Cogit terbaru sudah diterapkan.'); }
        if(data&&typeof data==='object'&&data.id){ const i=p.replies.findIndex(x=>x.id===reply.id); if(i>=0) p.replies[i]={...p.replies[i],...data,username:data.username||p.replies[i].username||DATA.profile.username||''}; }
        _pl=0; await loadPosts(); viewKomunitas(); return toast('Balasan terkirim'); }
      LS.set('posts',ps); viewKomunitas();
    } else if(kind==='nera'){
      const text=(v.msg||'').trim(); if(!text) return; neraAsk(text);
    }
  }catch(err){
    if(kind==='register'||kind==='login') authErr(err.message); else toast(err.message);
  }finally{ busy(false); }
});

/* ===== BOOT ===== */
(async()=>{
  try{
    if(LS.get('volatile',false) && !sessionStorage.getItem('cognera:alive')){ if(SB){ try{ await SB.auth.signOut(); }catch(e){} } LS.del('session'); LS.del('volatile'); }
  }catch(e){}
  if(SB){
    try{
      // PKCE OAuth callback: exchange the returned code before reading the session.

  route();
})();
